<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lynkk comparison stage</title>
<style>
@font-face { font-family: "JetBrains Mono"; src: url(jetbrains-mono-latin.woff2) format("woff2"); font-weight: 100 800; }
:root {
  /* Lynkk "grid" design tokens, from lynkk.ai */
  --white: #fff; --paper: #f9f9fa; --mist: #f5f5f5; --sand: #ece9e2;
  --black: #111; --coal: #171717; --coal2: #1d1d1d; --coal3: #2e2e2e;
  --ink2: #11111180; --ink3: #1111114d; --rule: #e0e3e9; --rule-n: #292c31;
  --violet: #7063be; --violet-tint: #e2e0f2; --lavender: #beb4fb; --violet-soft: #978bdc;
  --orange: #f57b3a; --pink: #f7b7ef; --forest: #235634; --leaf: #93b45c; --live: #ff3b30;
  --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --display: "Inter Display", "Inter", ui-sans-serif, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--white); }
body { font-family: var(--sans); color: var(--black); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: relative; overflow: hidden; background: var(--white); }
body.v #stage { width: 1080px; height: 1920px; }
body.h #stage { width: 1920px; height: 1080px; }

.scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
.scene.light { background: var(--white); color: var(--black);
  background-image: radial-gradient(#1111110d 2px, transparent 2px); background-size: 36px 36px; }
.scene.dark { background: var(--black); color: var(--white);
  background-image: radial-gradient(#ffffff0d 2px, transparent 2px); background-size: 36px 36px; }
.inner { position: absolute; display: flex; flex-direction: column; }
body.v .inner { left: 80px; right: 80px; top: 250px; bottom: 600px; gap: 34px; }
body.h .inner { left: 120px; right: 120px; top: 190px; bottom: 200px; gap: 30px; }

/* chrome */
#chrome { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.brand { position: absolute; display: flex; align-items: center; gap: 16px; font-weight: 600; letter-spacing: -0.02em; }
body.v .brand { left: 80px; top: 120px; font-size: 44px; }
body.h .brand { left: 120px; top: 64px; font-size: 36px; }
.brand img { display: block; }
body.v .brand img { width: 58px; height: 58px; }
body.h .brand img { width: 46px; height: 46px; }
.site { position: absolute; font-family: var(--mono); letter-spacing: 0.02em; opacity: .7; }
body.v .site { right: 80px; top: 136px; font-size: 30px; }
body.h .site { right: 120px; top: 74px; font-size: 26px; }
#progress { position: absolute; left: 0; top: 0; height: 6px; background: var(--violet); }
body.v #progress { display: none; }

/* captions */
#cap { position: absolute; left: 0; right: 0; display: flex; justify-content: center; z-index: 30; }
body.v #cap { top: 1372px; }
body.h #cap { bottom: 64px; }
#cap span { display: inline-block; background: var(--black); color: var(--white); font-weight: 700;
  letter-spacing: -0.015em; text-align: center; box-shadow: 0 10px 30px #11111140; }
body.v #cap span { font-size: 58px; line-height: 1.18; padding: 20px 34px; border-radius: 22px; max-width: 920px; }
body.h #cap span { font-size: 40px; line-height: 1.2; padding: 14px 28px; border-radius: 16px; max-width: 1500px; }
#cap span b { color: var(--lavender); font-weight: 800; }
.dark-cap #cap span { background: var(--white); color: var(--black); }
.dark-cap #cap span b { color: var(--violet); }

/* type */
.kicker { font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--violet); font-weight: 600; }
.dark .kicker { color: var(--lavender); }
body.v .kicker { font-size: 30px; }
body.h .kicker { font-size: 24px; }
.title { font-family: var(--display); font-weight: 700; letter-spacing: -0.035em; line-height: 1.02; }
body.v .title { font-size: 96px; }
body.h .title { font-size: 84px; }
.title em { font-style: normal; color: var(--violet); }
.dark .title em { color: var(--lavender); }
.src { font-family: var(--mono); color: var(--ink2); position: absolute; }
.dark .src { color: #ffffff70; }
body.v .src { left: 80px; right: 80px; top: 1610px; font-size: 22px; text-align: center; }
body.h .src { left: 120px; bottom: 150px; font-size: 18px; }

/* hook */
.hook .big1 { font-family: var(--display); font-weight: 800; letter-spacing: -0.045em; line-height: .98; }
body.v .hook .big1 { font-size: 116px; margin-bottom: 26px; }
body.h .hook .big1 { font-size: 120px; }
.hook .big1 .l2 { color: var(--lavender); }
.hook .punch { font-family: var(--display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
body.v .hook .punch { font-size: 70px; }
body.h .hook .punch { font-size: 56px; }
.hook .punch span { background: var(--white); color: var(--black); padding: .04em .22em; border-radius: .18em;
  box-decoration-break: clone; -webkit-box-decoration-break: clone; }
body.h .hook .inner { flex-direction: row; align-items: center; gap: 90px; }
body.h .hook .col { flex: 1; display: flex; flex-direction: column; gap: 44px; }

/* versus */
.versus .inner { align-items: center; justify-content: center; text-align: center; }
.vs-wrap { display: flex; flex-direction: column; align-items: center; gap: 30px; }
body.h .vs-wrap { flex-direction: row; gap: 80px; }
.vs-name { font-family: var(--display); font-weight: 800; letter-spacing: -0.03em; display: flex; align-items: center; gap: .22em; }
body.v .vs-name { font-size: 170px; }
body.h .vs-name { font-size: 150px; }
.vs-name img { width: .8em; height: .8em; }
.vs-x { font-family: var(--mono); color: var(--violet); font-weight: 600; }
body.v .vs-x { font-size: 64px; }
body.h .vs-x { font-size: 56px; }
.vs-rival { color: #11111166; }
.vs-sub { font-family: var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--ink2); }
body.v .vs-sub { font-size: 32px; margin-top: 40px; }
body.h .vs-sub { font-size: 26px; margin-top: 30px; }

/* row */
body.h .row .inner { display: grid; grid-template-columns: 760px 1fr; column-gap: 80px; align-items: center; }
body.h .row.noui .inner { grid-template-columns: 1fr; }
.lcol { display: flex; flex-direction: column; gap: 26px; }
body.v .lcol { gap: 26px; }
.cmp { display: grid; gap: 18px; }
body.v .cmp { grid-template-columns: 1fr 1fr; }
body.h .cmp { grid-template-columns: 1fr; margin-top: 14px; }
body.h .row.noui .cmp { grid-template-columns: 1fr 1fr; max-width: 1500px; }
.cmpc { border-radius: 22px; padding: 26px 28px; display: flex; flex-direction: column; gap: 12px; }
body.h .cmpc { padding: 22px 26px; flex-direction: row; align-items: center; gap: 22px; }
body.h .row.noui .cmpc { flex-direction: column; align-items: flex-start; padding: 40px 44px; }
.cmpc .who { font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; display: flex; align-items: center; gap: 12px; }
body.v .cmpc .who { font-size: 22px; }
body.h .cmpc .who { font-size: 19px; min-width: 190px; }
.cmpc .txt { font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
body.v .cmpc .txt { font-size: 36px; }
body.h .cmpc .txt { font-size: 32px; }
body.h .row.noui .cmpc .txt { font-size: 48px; }
.cmpc.them { background: var(--mist); color: #11111199; border: 2px solid var(--rule); }
.cmpc.us { background: var(--black); color: var(--white); }
.cmpc.us .who { color: var(--lavender); }
.ico { width: 1.25em; height: 1.25em; flex: none; }
.uiwrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
body.v .uiwrap { font-size: 34px; }
body.v .w { width: 27em; }
body.h .uiwrap { font-size: 32px; }

/* big */
.bigscene .inner { justify-content: center; }
.bignum { font-family: var(--display); font-weight: 800; letter-spacing: -0.06em; line-height: .9; color: var(--lavender); }
body.v .bignum { font-size: 400px; }
body.h .bignum { font-size: 330px; }
.bigsub { font-family: var(--display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; }
body.v .bigsub { font-size: 76px; }
body.h .bigsub { font-size: 64px; max-width: 1300px; }

/* pricing */
.prices { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 28px; }
body.h .prices { max-width: 1300px; }
.price { border-radius: 28px; padding: 44px 40px; display: flex; flex-direction: column; gap: 14px; border: 2px solid var(--rule); background: var(--white); }
.price.us { background: var(--black); color: var(--white); border-color: var(--black); box-shadow: 0 30px 60px #7063be40; }
.price .pn { font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: 26px; }
.price.us .pn { color: var(--lavender); }
.price .pv { font-family: var(--display); font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
body.v .price .pv { font-size: 118px; }
body.h .price .pv { font-size: 150px; }
.price .pnote { font-size: 32px; font-weight: 500; opacity: .75; line-height: 1.2; }
.price.them .pv { color: #11111170; }

/* recap */
.recap-list { display: flex; flex-direction: column; gap: 22px; }
.recap-item { display: flex; align-items: center; gap: 26px; font-family: var(--display); font-weight: 700; letter-spacing: -0.025em; }
body.v .recap-item { font-size: 60px; }
body.h .recap-item { font-size: 58px; }
.recap-item .ck { width: 1.05em; height: 1.05em; border-radius: 50%; background: var(--violet); color: var(--white); display: flex; align-items: center; justify-content: center; flex: none; }
.recap-item .ck svg { width: .62em; height: .62em; }

/* cta */
.cta .inner { align-items: center; justify-content: center; text-align: center; }
.cta-logo { width: 230px; height: 230px; }
body.h .cta-logo { width: 180px; height: 180px; }
.cta-t { font-family: var(--display); font-weight: 800; letter-spacing: -0.045em; line-height: 1.0; }
body.v .cta-t { font-size: 94px; }
body.h .cta-t { font-size: 104px; }
.cta-t .l1 { color: #ffffff66; }
.btn { display: inline-flex; align-items: center; gap: 18px; background: var(--white); color: var(--black); font-weight: 700; border-radius: 999px; letter-spacing: -0.01em; }
body.v .btn { font-size: 50px; padding: 30px 56px; }
body.h .btn { font-size: 42px; padding: 24px 48px; }
.btn .arr { width: 1em; height: 1em; }
.cta-note { font-family: var(--mono); color: #ffffff99; letter-spacing: .02em; }
body.v .cta-note { font-size: 28px; }
body.h .cta-note { font-size: 24px; }

/* ---------- product UI widgets (em based) ---------- */
.card { background: var(--white); color: var(--black); border: 1px solid var(--rule); border-radius: .62em; box-shadow: 0 1.2em 3em #1111141a, 0 .1em .3em #1111140d; }
.dark .card { border-color: var(--coal3); }
.w { width: 31em; display: flex; flex-direction: column; gap: .7em; }
body.h .w { width: 26em; }
.chead { display: flex; align-items: center; gap: .5em; padding: .8em 1em; border-bottom: 1px solid var(--rule); font-weight: 600; font-size: .9em; }
.chead .grow1 { flex: 1; }
.pill { font-family: var(--mono); font-size: .62em; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: .35em .7em; border-radius: 999px; background: var(--mist); color: var(--ink2); white-space: nowrap; }
.pill.v { background: var(--violet-tint); color: var(--violet); }
.pill.k { background: var(--black); color: var(--white); }
.pill.live { background: #ff3b301a; color: #c93b40; }
.recdot { width: .55em; height: .55em; border-radius: 50%; background: var(--live); flex: none; }
.cbody { padding: .9em 1em; display: flex; flex-direction: column; gap: .75em; }
.line { display: flex; gap: .6em; align-items: flex-start; }
.av { width: 1.6em; height: 1.6em; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .78em; flex: none; color: var(--white); }
.av.p { background: var(--violet); } .av.r { background: var(--orange); } .av.a { background: var(--forest); } .av.s { background: #c24fb0; } .av.y { background: var(--black); }
.lmeta { font-size: .66em; color: var(--ink2); font-family: var(--mono); margin-bottom: .15em; }
.ltxt { font-size: .86em; line-height: 1.32; font-weight: 500; }
.sumbox { background: var(--violet-tint); border-radius: .45em; padding: .7em .85em; display: flex; flex-direction: column; gap: .35em; }
.sumrow { display: flex; gap: .5em; font-size: .8em; line-height: 1.3; }
.sumrow .tag { font-family: var(--mono); font-size: .78em; font-weight: 700; color: var(--violet); text-transform: uppercase; letter-spacing: .05em; min-width: 5.4em; padding-top: .12em; }

.chips { display: flex; flex-wrap: wrap; gap: .38em; }
.chip { font-size: .78em; font-weight: 600; padding: .42em .75em; border-radius: 999px; background: var(--white); border: 1px solid var(--rule); white-space: nowrap; }
.chip.g { background: var(--mist); color: #11111188; }
.chip.k { background: var(--black); color: var(--white); border-color: var(--black); }
.chip.v { background: var(--violet); color: var(--white); border-color: var(--violet); }
.chip .beta { font-family: var(--mono); font-size: .7em; opacity: .6; margin-left: .3em; }
.glabel { font-family: var(--mono); font-size: .66em; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); display: flex; justify-content: space-between; }
.dark .glabel { color: #ffffff88; }

.bars { display: flex; flex-direction: column; gap: 1.1em; width: 100%; }
.bar-row { display: flex; flex-direction: column; gap: .4em; }
.bar-lab { display: flex; justify-content: space-between; font-weight: 600; font-size: .9em; }
.bar-lab .mono { font-family: var(--mono); }
.bar-track { height: 1.4em; border-radius: .7em; background: var(--mist); overflow: hidden; }
.bar-fill { height: 100%; border-radius: .7em; background: #11111140; width: 0; }
.bar-fill.us { background: var(--violet); }

.task { display: flex; align-items: center; gap: .65em; padding: .55em 0; border-bottom: 1px solid var(--rule); }
.task:last-child { border-bottom: 0; }
.cbx { width: 1.05em; height: 1.05em; border: 2px solid #11111155; border-radius: .25em; flex: none; }
.ttxt { flex: 1; font-size: .84em; font-weight: 600; line-height: 1.25; }
.tmeta { font-family: var(--mono); font-size: .62em; color: var(--ink2); white-space: nowrap; }
.jira { font-family: var(--mono); font-size: .6em; font-weight: 700; background: var(--violet); color: var(--white); padding: .3em .55em; border-radius: .35em; white-space: nowrap; }
.sendbtn { align-self: flex-end; display: inline-flex; align-items: center; gap: .45em; background: var(--black); color: var(--white); font-weight: 700; font-size: .8em; padding: .6em 1em; border-radius: .5em; }

.q { align-self: flex-end; background: var(--black); color: var(--white); padding: .7em .9em; border-radius: .7em .7em .15em .7em; font-size: .82em; font-weight: 500; line-height: 1.3; max-width: 85%; }
.searching { font-family: var(--mono); font-size: .66em; color: var(--ink2); display: flex; align-items: center; gap: .5em; }
.ans { font-size: .84em; line-height: 1.4; font-weight: 500; }
.cite { display: inline-flex; align-items: center; justify-content: center; width: 1.25em; height: 1.25em; border-radius: .3em; background: var(--violet-tint); color: var(--violet); font-family: var(--mono); font-size: .7em; font-weight: 700; vertical-align: .15em; margin: 0 .1em; }
.srcrow { display: flex; align-items: center; gap: .6em; padding: .5em .65em; background: var(--paper); border: 1px solid var(--rule); border-radius: .45em; font-size: .72em; }
.srcrow .nm { font-weight: 700; } .srcrow .mt { font-family: var(--mono); color: var(--ink2); margin-left: auto; }

.wave { display: flex; align-items: center; gap: .14em; height: 2.6em; }
.wave i { display: block; width: .22em; border-radius: .11em; background: #11111155; }
.wave.v i { background: var(--violet); }
.player { position: relative; padding: .6em .2em; }
.phead { position: absolute; top: 0; bottom: 0; width: .16em; background: var(--live); border-radius: .08em; left: 0; }
.phead::before { content: ""; position: absolute; top: -.25em; left: -.22em; width: .6em; height: .6em; border-radius: 50%; background: var(--live); }
.ts { font-family: var(--mono); font-size: .72em; font-weight: 700; padding: .25em .5em; border-radius: .35em; background: var(--mist); white-space: nowrap; }
.ts.on { background: var(--violet); color: var(--white); }
.track { display: flex; flex-direction: column; gap: .3em; }

.toast { display: flex; gap: .8em; align-items: flex-start; padding: 1em 1.1em; border-radius: .8em; background: #ffffffee; border: 1px solid var(--rule); box-shadow: 0 1.4em 3em #11111426; }
.appi { width: 2.4em; height: 2.4em; border-radius: .55em; background: var(--black); display: flex; align-items: center; justify-content: center; flex: none; }
.appi img { width: 1.6em; height: 1.6em; }
.tbtns { display: flex; gap: .5em; margin-top: .55em; }
.tbtn { font-size: .74em; font-weight: 700; padding: .45em .9em; border-radius: .45em; background: var(--mist); }
.tbtn.k { background: var(--black); color: var(--white); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; padding: .7em; }
.tile { aspect-ratio: 16 / 10; border-radius: .5em; background: var(--coal2); color: var(--white); display: flex; align-items: center; justify-content: center; position: relative; }
.tile .tn { position: absolute; left: .6em; bottom: .5em; font-size: .62em; font-weight: 600; background: #00000080; padding: .2em .45em; border-radius: .3em; }
.tile .av { width: 2.4em; height: 2.4em; font-size: 1em; }
.tile.bot { background: var(--violet); outline: .16em solid var(--lavender); }
.tile.bot img { width: 2.2em; height: 2.2em; }
.win { background: var(--coal); border-color: var(--coal3); color: var(--white); }
.win .chead { border-color: var(--coal3); }

.evt { display: flex; align-items: center; gap: .7em; padding: .65em .2em; border-bottom: 1px solid var(--rule); }
.evt:last-child { border-bottom: 0; }
.evt .tm { font-family: var(--mono); font-size: .72em; font-weight: 700; width: 3.6em; color: var(--ink2); }
.evt .en { flex: 1; font-size: .86em; font-weight: 600; } .evt .en small { display: block; font-size: .76em; color: var(--ink2); font-weight: 500; margin-top: .1em; }
.switch { width: 2.6em; height: 1.45em; border-radius: 1em; background: #11111130; position: relative; flex: none; }
.switch .knob { position: absolute; top: .17em; left: .17em; width: 1.1em; height: 1.1em; border-radius: 50%; background: var(--white); box-shadow: 0 .1em .2em #0003; }

.weeks { display: grid; grid-template-columns: repeat(10, 1fr); gap: .3em; }
.wk { height: 2.4em; border-radius: .35em; background: var(--violet); }
.wk.g { background: #11111140; }
.feat { display: flex; align-items: center; gap: .75em; padding: .7em .2em; border-bottom: 1px solid var(--rule); font-size: .88em; font-weight: 600; }
.feat:last-child { border-bottom: 0; }
.fi { width: 2em; height: 2em; border-radius: .5em; background: var(--violet-tint); color: var(--violet); display: flex; align-items: center; justify-content: center; flex: none; }
.fi svg { width: 1.15em; height: 1.15em; }
.typed { font-family: var(--mono); font-size: .8em; line-height: 1.5; }
.filled { font-size: .82em; line-height: 1.4; color: var(--ink2); font-weight: 500; }
.gonebox { display: flex; align-items: center; gap: .7em; padding: .7em .8em; border-radius: .5em; background: var(--paper); border: 1px dashed #11111140; }
.strike { font-family: var(--mono); font-size: .7em; font-weight: 700; color: #c93b40; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.inputbar { display: flex; align-items: center; gap: .6em; padding: .65em .8em; border: 1px solid var(--rule); border-radius: .55em; font-size: .82em; font-weight: 500; }
.confirm { border: 2px solid var(--violet); border-radius: .6em; padding: .8em .9em; display: flex; flex-direction: column; gap: .4em; background: var(--white); }
.okline { display: flex; align-items: center; gap: .5em; font-size: .8em; font-weight: 700; color: var(--forest); }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="chrome">
    <div id="progress"></div>
    <div class="brand"><img id="brandlogo" src="logo-black.svg" alt=""><span>Lynkk</span></div>
    <div class="site">lynkk.ai</div>
  </div>
  <div id="cap"><span id="capt"></span></div>
</div>
<script>
const ICON = {

function rnd(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function wave(n, seed, cls = '', minH = .18) {
  const r = rnd(seed); let h = '';
  for (let i = 0; i < n; i++) {
    const env = .35 + .65 * Math.abs(Math.sin(i / n * Math.PI * 3.2 + seed));
    h += `<i data-h="${(minH + (1 - minH) * r() * env).toFixed(3)}" style="height:${((minH + (1 - minH) * r() * env) * 100).toFixed(1)}%"></i>`;
  }
  return `<div class="wave ${cls}">${h}</div>`;
}

      <div class="punch" ${A(.5)}><span>${s.punch}</span></div></div>`;
    return { theme: 'dark', html: `<div class="inner">${t}<div class="uiwrap" style="${document.body.classList.contains('v') ? 'font-size:31px' : ''}">${W[s.ui.type](s.ui)}</div></div>` };
  },
  versus: () => ({
    theme: 'light', html: `<div class="inner"><div class="vs-wrap">
      <div class="vs-name" ${A(0, 'left')}><img src="logo-black.svg" alt="">Lynkk</div>
      <div class="vs-x" ${A(.18, 'pop')}>VS</div>
      <div class="vs-name vs-rival" ${A(.3, 'right')}>${META.rival}</div></div>
      <div class="vs-sub" ${A(.5, 'fade')}>${META.format === 'vertical' ? 'In under a minute' : 'Feature by feature'}</div></div>`
  }),
  row: (s) => {
    const ui = s.ui ? `<div class="uiwrap">${W[s.ui.type](s.ui)}</div>` : '';
    return {
      theme: 'light', cls: s.ui ? '' : 'noui', src: !!(s.them || s.us),
      html: `<div class="inner"><div class="lcol"><div class="kicker" ${A(0, 'fade')}>${s.kicker}</div>
      <div class="title" ${A(.03)}>${hl(s.title)}</div>${cmpCards(s)}</div>${ui}</div>`
    };
  },
  big: (s) => ({
    theme: 'dark', html: `<div class="inner"><div class="kicker" ${A(0, 'fade')}>${s.kicker}</div>
      <div class="bignum" ${A(.04, 'pop')}>${s.big}</div><div class="bigsub" ${A(.25)}>${s.sub}</div></div>`
  }),
  pricing: (s) => ({
    theme: 'light', src: true, html: `<div class="inner" style="justify-content:center"><div class="kicker" ${A(0, 'fade')}>${s.kicker}</div>
      <div class="title" ${A(.03)}>Pay less. <em>Get more.</em></div>
      <div class="prices">${s.cards.map((c, i) => `<div class="price ${c.us ? 'us' : 'them'}" ${A(.15 + i * .25, 'pop')}><div class="pn">${c.name}</div><div class="pv">${c.price}</div><div class="pnote">${c.note}</div></div>`).join('')}</div></div>`
  }),
  recap: (s) => ({
    theme: 'light', html: `<div class="inner" style="justify-content:center"><div class="kicker" ${A(0, 'fade')}>Why teams switch to Lynkk</div>
      <div class="recap-list">${s.items.map((x, i) => `<div class="recap-item" ${A(.06 + i * .16, 'left')}><span class="ck">${ICON.check}</span>${x}</div>`).join('')}</div></div>`
  }),
  cta: (s) => ({
    theme: 'dark', html: `<div class="inner" style="gap:${META.format === 'vertical' ? 56 : 40}px"><img class="cta-logo" src="logo-white.svg" ${A(0, 'pop')} alt="">
      <div class="cta-t"><div class="l1" ${A(.05)}>${s.title[0]}</div><div ${A(.3)}>${s.title[1].replace('Lynkk', '<span style="color:var(--lavender)">Lynkk</span>')}</div></div>
      <div class="btn" ${A(.55, 'pop')}>Start free at lynkk.ai <span class="arr">${ICON.arrow}</span></div>
      <div class="cta-note" ${A(.7, 'fade')}>No credit card required · Web + Mac</div></div>`
  }),
};

// ---------------- timeline ----------------
const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const clamp = (x) => Math.max(0, Math.min(1, x));

function build(meta) {
  META = meta;
  document.body.className = meta.format === 'vertical' ? 'v' : 'h';
  const root = document.getElementById('scenes');
  meta.segments.forEach((seg, i) => {
    const r = SC[seg.scene.kind](seg.scene);
    const el = document.createElement('div');
    el.className = `scene ${r.theme} ${seg.scene.kind === 'big' ? 'bigscene' : seg.scene.kind} ${r.cls || ''}`;
    el.innerHTML = r.html + (r.src ? `<div class="src">${meta.source}</div>` : '');
    root.appendChild(el);
    const vd = Math.max(1, seg.voice_end - seg.start);
    SCENES.push({ el, seg, theme: r.theme, vd,
      anims: [...el.querySelectorAll('.a')].map(n => ({ n, t: parseFloat(n.dataset.f) * vd, k: n.dataset.k })),
      grows: [...el.querySelectorAll('.grow')], types: [...el.querySelectorAll('.type')].map(n => { n.dataset.t = n.textContent; return n; }),
      phs: [...el.querySelectorAll('.ph')], clocks: [...el.querySelectorAll('.clock')], cycles: [...el.querySelectorAll('.cycle')],
      presses: [...el.querySelectorAll('.press')], toggles: [...el.querySelectorAll('.tog')], tsons: [...el.querySelectorAll('.tson')],
      shrinks: [...el.querySelectorAll('.shrink')], fadeolds: [...el.querySelectorAll('.fadeold')], sels: [...el.querySelectorAll('.chip.sel')] });
  });
  meta.segments.forEach(seg => seg.chunks.forEach(c => CAPTIONS.push(c)));
}

function setTime(t) {
  const D = META.duration;
  let front = null;
  for (const S of SCENES) {
    const { seg } = S;
    const start = seg.start - (seg.i === 0 ? 1 : 0.18), end = seg.end;
    if (t < start - 0.01 || t > end + 0.4) { S.el.style.opacity = 0; S.el.style.display = 'none'; continue; }
    S.el.style.display = 'block';
    const lt = t - seg.start;
    const fin = seg.i === 0 ? 1 : ease((t - start) / 0.35);
    const fout = 1 - ease((t - end) / 0.35);
    const op = Math.min(fin, fout);
    S.el.style.opacity = op;
    S.el.style.zIndex = 1 + seg.i;
    const inner = S.el.querySelector('.inner');
    const kb = 1 + 0.018 * clamp(lt / Math.max(1, end - seg.start));
    inner.style.transform = `scale(${kb})`;
    if (op > 0.5) front = S;
    const f = (x) => clamp(lt / S.vd >= 0 ? (lt - parseFloat(x) * S.vd) : -1);
    for (const a of S.anims) {
      const p = ease((lt - a.t) / 0.5);
      let tr = '';
      if (a.k === 'up') tr = `translateY(${(1 - p) * 40}px)`;
      else if (a.k === 'down') tr = `translateY(${-(1 - p) * 40}px)`;
      else if (a.k === 'left') tr = `translateX(${-(1 - p) * 60}px)`;
      else if (a.k === 'right') tr = `translateX(${(1 - p) * 60}px)`;
      else if (a.k === 'pop') { const q = (lt - a.t) / 0.42; const s = q <= 0 ? .85 : q >= 1 ? 1 : .85 + .15 * (1 - Math.pow(1 - q, 3)) + Math.sin(q * Math.PI) * .05; tr = `scale(${s})`; }
      a.n.style.opacity = p;
      a.n.style.transform = tr;
    }
    const prog = (n, k0 = 'f0', k1 = 'f1') => clamp((lt - parseFloat(n.dataset[k0]) * S.vd) / ((parseFloat(n.dataset[k1]) - parseFloat(n.dataset[k0])) * S.vd));
    for (const n of S.grows) n.style.width = (ease(prog(n)) * parseFloat(n.dataset.w)) + '%';
    for (const n of S.types) { const full = n.dataset.t; const k = Math.round(prog(n) * full.length); n.textContent = full.slice(0, k) || '​'; }
    for (const n of S.phs) {
      let x;
      const p1 = prog(n);
      const tJump = parseFloat(n.dataset.f1) * S.vd;
      if (lt < tJump) x = parseFloat(n.dataset.x0) + (parseFloat(n.dataset.x1) - parseFloat(n.dataset.x0)) * 0; // waiting at start
      else x = parseFloat(n.dataset.x1) + (parseFloat(n.dataset.x2) - parseFloat(n.dataset.x1)) * clamp((lt - tJump) / (S.vd * (1 - parseFloat(n.dataset.f1))));
      if (lt >= tJump && lt < tJump + 0.25) x = parseFloat(n.dataset.x0) + (parseFloat(n.dataset.x1) - parseFloat(n.dataset.x0)) * ease((lt - tJump) / 0.25);
      n.style.left = x + '%';
    }
    for (const n of S.clocks) { const s = Math.round(parseFloat(n.dataset.s0) + (parseFloat(n.dataset.s1) - parseFloat(n.dataset.s0)) * prog(n)); n.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
    for (const n of S.cycles) { const it = n.dataset.items.split('|'); n.textContent = it[Math.min(it.length - 1, Math.floor(prog(n) * it.length))]; }
    for (const n of S.presses) { const on = lt >= parseFloat(n.dataset.pf) * S.vd; n.style.background = on ? 'var(--violet)' : ''; if (on) n.style.color = 'var(--white)'; }
    for (const n of S.tsons) { n.classList.toggle('on', lt >= parseFloat(n.dataset.on) * S.vd - 0.2); }
    for (const n of S.toggles) { const p = ease((lt - parseFloat(n.dataset.f) * S.vd) / 0.3); n.style.background = p > .5 ? 'var(--violet)' : ''; n.firstElementChild.style.left = (0.17 + p * 1.15) + 'em'; }
    for (const n of S.shrinks) { const p = ease(prog(n)); n.querySelectorAll('i').forEach(i => { i.style.height = (parseFloat(i.dataset.h) * (1 - p) * 100 + 4 * p) + '%'; i.style.opacity = 1 - .6 * p; }); }
    for (const n of S.fadeolds) { const p = ease(prog(n)); n.style.opacity = 1 - .8 * p; n.style.background = p > .5 ? '#11111118' : ''; }
    for (const n of S.sels) { const on = lt >= 0.35 * S.vd; n.classList.toggle('v', on); }
  }
  // chrome follows the front scene's theme
  const dark = front && front.theme === 'dark';
  document.getElementById('brandlogo').src = dark ? 'logo-white.svg' : 'logo-black.svg';
  document.getElementById('chrome').style.color = dark ? 'var(--white)' : 'var(--black)';
  document.body.classList.toggle('dark-cap', !!dark);
  document.getElementById('progress').style.width = (t / D * 100) + '%';
  // captions
  const c = CAPTIONS.find(c => t >= c.start - 0.05 && t < c.end + 0.05);
  const capEl = document.getElementById('capt');
  if (c) {
    capEl.parentElement.style.opacity = 1;
    const html = c.text.replace(/(\$?\d[\d.,:]*\+?|Hinglish|Lynkk|lynkk\.ai)/g, '<b>$1</b>');
    if (capEl.dataset.cur !== c.text) { capEl.innerHTML = html; capEl.dataset.cur = c.text; capEl.dataset.t0 = c.start; }
    const q = clamp((t - parseFloat(capEl.dataset.t0)) / 0.18);
    capEl.style.transform = `translateY(${(1 - ease(q)) * 14}px) scale(${.96 + .04 * ease(q)})`;
  } else {
    capEl.parentElement.style.opacity = 0;
  }
}

window.__init = (meta) => { build(meta); return true; };
window.__set = (t) => { setTime(t); return true; };
</script>
</body>
</html>
