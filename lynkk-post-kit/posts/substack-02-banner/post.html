<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Substack post 2 banner · Lynkk post</title>
<link rel="stylesheet" href="../../kit/post.css" />
<!-- Slide-specific CSS goes here, only when no kit block fits. Tokens only (var(--gr-*)), no hex. -->
<style></style>
</head>
<body>

<!-- 01 · Substack header for "Stop opening meetings with 'remind me where we landed'".
     Split: headline left, the morning briefing (TRUTHS: Before the meeting) on the sky plate. -->
<section class="post" id="s1" data-size="wide">
  <main class="post-body" data-dots>
    <div class="split">
      <div>
        <span class="eyebrow" data-tone="quiet">On the Lynkk Substack</span>
        <h2 class="t-h2">Stop asking where you landed. <span class="ink-2">Know it before the call.</span></h2>
        <p class="t-lead mt-m">A five-minute brief, and a morning email that starts it for you.</p>
      </div>
      <div class="plate plate-sky scene" data-rings>
        <div class="glass" data-size="l">
          <div class="glass-title">Morning briefing</div>
          <div class="glass-body">
            <div class="m-row"><span class="m-t">10:00</span>Acme renewal with Priya</div>
            <div class="m-row"><span class="m-k">Last note</span>Pricing review</div>
            <div class="m-row"><span class="m-k">Still open</span>3 action items</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</section>

<script src="../../kit/post.js"></script>
</body>
</html>
