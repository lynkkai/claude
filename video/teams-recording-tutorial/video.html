<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lynkk: How to record a Teams meeting</title>
<style>
/* Lynkk video theme. Swap these tokens to match the official brand kit. */
:root {
  --bg: #070A18;
  --surface: #0E1330;
  --surface2: #161C40;
  --surface3: #1D2550;
  --line: rgba(148, 163, 255, .16);
  --line2: rgba(148, 163, 255, .28);
  --text: #F5F7FF;
  --muted: #A6AED4;
  --dim: #6B7299;
  --violet: #7C5CFF;
  --blue: #4F7BFF;
  --cyan: #22D3EE;
  --red: #FF5C7A;
  --green: #34D399;
  --amber: #FBBF24;
  --teams: #7B83EB;
  --grad: linear-gradient(120deg, #7C5CFF 0%, #4F7BFF 52%, #22D3EE 100%);
  --grad-soft: linear-gradient(120deg, rgba(124,92,255,.22), rgba(34,211,238,.14));
}
* { box-sizing: border-box; margin: 0; padding: 0; transition: none !important; animation: none !important; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: 'Inter', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
.abs { position: absolute; }
.scene { position: absolute; inset: 0; display: none; }
.disp { font-family: 'Inter Display', 'Inter', sans-serif; letter-spacing: -0.02em; }
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.muted { color: var(--muted); }

/* background */
#bg { position: absolute; inset: 0; }
.blob { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; }
#grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(160,170,255,.16) 1.2px, transparent 1.3px); background-size: 44px 44px; opacity: .45;
  -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 20%, transparent 75%); }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(3,5,14,.75) 100%); }

/* shared bits */
.kicker { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: var(--cyan);
  padding: 10px 18px; border-radius: 999px; background: rgba(34,211,238,.08); border: 1px solid rgba(34,211,238,.28); }
.kicker i { width: 10px; height: 10px; border-radius: 50%; background: var(--grad); display: block; }
.kicker.red { color: var(--red); background: rgba(255,92,122,.08); border-color: rgba(255,92,122,.3); }
.kicker.red i { background: var(--red); }
.h1 { font-family: 'Inter Display', 'Inter'; font-weight: 800; font-size: 78px; line-height: 1.04; letter-spacing: -0.03em; }
.h2 { font-family: 'Inter Display', 'Inter'; font-weight: 800; font-size: 58px; line-height: 1.08; letter-spacing: -0.025em; }
.card { background: linear-gradient(180deg, rgba(30,38,84,.72), rgba(16,21,50,.72)); border: 1px solid var(--line); border-radius: 26px; }
.pill { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 20px; background: var(--surface2); border: 1px solid var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; border-radius: 14px; font-weight: 700; color: #fff; background: var(--grad); box-shadow: 0 10px 30px rgba(79,123,255,.35); }
.icon-circle { display: flex; align-items: center; justify-content: center; border-radius: 18px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: rgba(124,92,255,.16); color: #C9BEFF; border: 1px solid rgba(124,92,255,.32); }
.chip.teams { background: rgba(123,131,235,.16); color: #C3C7FF; border-color: rgba(123,131,235,.4); }
.chip.green { background: rgba(52,211,153,.12); color: #7EF0C4; border-color: rgba(52,211,153,.35); }
.chip.red { background: rgba(255,92,122,.12); color: #FF9DB0; border-color: rgba(255,92,122,.35); }
.chip.cyan { background: rgba(34,211,238,.1); color: #8BEBFA; border-color: rgba(34,211,238,.32); }
.chip.amber { background: rgba(251,191,36,.1); color: #FCD877; border-color: rgba(251,191,36,.32); }

/* logo */
.logo { display: flex; align-items: center; gap: 14px; }
.logo .mark { border-radius: 28%; background: var(--grad); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 26px rgba(79,123,255,.4); }
.logo .word { font-family: 'Inter Display', 'Inter'; font-weight: 800; letter-spacing: -0.03em; }

/* window mock */
.win { position: absolute; left: 760px; top: 180px; width: 1000px; height: 620px; border-radius: 22px; overflow: hidden; background: #0B1029; border: 1px solid var(--line2);
  box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset; }
.win .bar { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 18px; background: #121838; border-bottom: 1px solid var(--line); font-size: 16px; color: var(--muted); }
.win .dots { display: flex; gap: 8px; margin-right: 10px; }
.win .dots b { width: 13px; height: 13px; border-radius: 50%; display: block; }
.win .body { position: absolute; left: 0; right: 0; top: 48px; bottom: 0; }
.url { flex: 1; height: 30px; border-radius: 9px; background: #0A0F26; border: 1px solid var(--line); display: flex; align-items: center; padding: 0 14px; gap: 8px; color: var(--text); font-size: 16px; }

/* step layout */
.stepcol { position: absolute; left: 120px; top: 196px; width: 590px; }
.steppill { display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; background: var(--grad); font-weight: 800; font-size: 19px; letter-spacing: .12em; color: #fff; }
.steptitle { margin-top: 26px; font-family: 'Inter Display', 'Inter'; font-weight: 800; font-size: 58px; line-height: 1.06; letter-spacing: -0.025em; }
.stepdesc { margin-top: 22px; font-size: 25px; line-height: 1.45; color: var(--muted); }
.bullets { margin-top: 34px; display: flex; flex-direction: column; gap: 16px; }
.bullet { display: flex; align-items: center; gap: 16px; font-size: 24px; font-weight: 600; }
.bullet .ck { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(52,211,153,.14); border: 1px solid rgba(52,211,153,.4); flex: none; }

/* tracker */
#tracker { position: absolute; top: 46px; left: 560px; width: 1240px; display: flex; gap: 10px; justify-content: flex-end; }
.tstep { display: flex; align-items: center; gap: 9px; padding: 8px 15px 8px 9px; border-radius: 999px; border: 1px solid var(--line); background: rgba(14,19,48,.8); font-size: 17px; font-weight: 600; color: var(--dim); }
.tstep b { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; background: var(--surface3); color: var(--muted); }
.tstep.on { color: #fff; border-color: rgba(124,92,255,.6); background: rgba(124,92,255,.18); }
.tstep.on b { background: var(--grad); color: #fff; }
.tstep.done b { background: rgba(52,211,153,.2); color: var(--green); }
.tstep.done { color: var(--muted); }

/* avatar */
#avatar { position: absolute; left: 0; top: 0; width: 190px; height: 190px; transform-origin: 50% 50%; }
#avatar .glow { position: absolute; inset: -30%; border-radius: 50%; background: radial-gradient(circle, rgba(79,123,255,.45), rgba(124,92,255,.15) 45%, transparent 68%); }
#avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#nametag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 12px; border-radius: 999px; background: rgba(14,19,48,.92); border: 1px solid var(--line2); font-size: 18px; font-weight: 600; white-space: nowrap; transform-origin: 50% 0; }
#nametag .bars { display: flex; align-items: center; gap: 3px; height: 22px; }
#nametag .bars i { width: 4px; border-radius: 3px; background: var(--grad); display: block; }

/* cursor */
#cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; visibility: hidden; z-index: 50; }
#ripple { position: absolute; left: 0; top: 0; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 3px solid rgba(34,211,238,.9); visibility: hidden; z-index: 49; }

/* meeting tiles */
.tile { position: absolute; width: 300px; height: 255px; border-radius: 18px; overflow: hidden; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; }
.tile .ini { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 36px; color: #fff; }
.tile .nm { position: absolute; left: 12px; bottom: 12px; padding: 5px 11px; border-radius: 9px; background: rgba(0,0,0,.45); font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.tline { padding: 12px 14px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); font-size: 16px; line-height: 1.4; }
.tline .who { font-weight: 700; font-size: 14px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.toggle { width: 54px; height: 30px; border-radius: 999px; background: #2A3160; position: relative; flex: none; }
.toggle b { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; display: block; }
.caret { display: inline-block; width: 2px; height: 1em; background: var(--cyan); vertical-align: -0.12em; margin-left: 2px; }
.bubble { border-radius: 20px; padding: 18px 20px; font-size: 21px; line-height: 1.45; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg">
    <div class="blob" id="blob1" style="background: radial-gradient(circle, rgba(124,92,255,.30), transparent 62%)"></div>
    <div class="blob" id="blob2" style="background: radial-gradient(circle, rgba(79,123,255,.24), transparent 62%)"></div>
    <div class="blob" id="blob3" style="background: radial-gradient(circle, rgba(34,211,238,.16), transparent 62%)"></div>
    <div id="grid"></div>
    <div id="vignette"></div>
  </div>
  <div id="scenes"></div>
  <div id="toplogo" class="abs" style="left:120px; top:44px"></div>
  <div id="tracker"></div>
  <div id="avatarGlowAnchor"></div>
  <div id="avatar"><div class="glow"></div></div>
  <div id="nametag"><span class="bars"><i></i><i></i><i></i><i></i><i></i></span><span>Ava</span><span style="color:var(--dim)">·</span><span class="muted">Lynkk guide</span></div>
  <div id="ripple"></div>
  <div id="cursor"><svg viewBox="0 0 40 40" width="40" height="40"><path d="M6 3 L6 32 L13.5 25 L18.5 36.5 L23.5 34.3 L18.6 23 L29 23 Z" fill="#fff" stroke="#0B1029" stroke-width="2.4" stroke-linejoin="round"/></svg></div>
  <div id="thumb" class="abs" style="inset:0; display:none">
    <div class="abs" style="left:930px; top:150px; width:940px">
      <div style="display:flex; gap:16px; align-items:center">
        <div class="kicker" style="font-size:26px"><i></i>Step by step</div>
        <div style="display:flex; align-items:center; gap:10px; padding:10px 20px; border-radius:999px; background:rgba(255,92,122,.14); border:2px solid rgba(255,92,122,.6); color:#FF9DB0; font-weight:800; font-size:26px"><b style="width:16px; height:16px; border-radius:50%; background:#FF5C7A; display:block"></b>REC</div>
      </div>
      <div class="disp" style="margin-top:30px; font-weight:900; font-size:142px; line-height:.95; letter-spacing:-0.04em">Record</div>
      <div class="disp grad-text" style="font-weight:900; font-size:142px; line-height:1.02; letter-spacing:-0.04em; padding-bottom:8px">Teams</div>
      <div class="disp" style="font-weight:900; font-size:142px; line-height:.95; letter-spacing:-0.04em">meetings</div>
      <div style="margin-top:40px; display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:20px; background:var(--grad); font-weight:800; font-size:40px">+ AI notes in 30s</div>
    </div>
  </div>
  <div id="fade" class="abs" style="inset:0; background:#05070F; opacity:0"></div>
</div>

<script src="build/timeline.js"></script>
<script>
const TL = window.TIMELINE;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const P = (t, a, d = .6, e = easeOut) => e(clamp((t - a) / d));

function show(el, k, o = {}) {
  const y = o.y ?? 26, x = o.x ?? 0, s = o.s ?? 1;
  el.style.opacity = k;
  el.style.visibility = k <= .001 ? 'hidden' : 'visible';
  el.style.transform = `translate(${(1 - k) * x}px, ${(1 - k) * y}px) scale(${s + (1 - s) * k})`;
}
function typeText(el, full, k, caret = true) {
  const n = Math.round(full.length * clamp(k));
  el.innerHTML = escapeHtml(full.slice(0, n)) + (caret && k > 0 && k < 1 ? '<span class="caret"></span>' : '');
}
function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

/* ---------- icons (stroke style) ---------- */
const ICONS = {
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  video: '<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/>',
  users: '<circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1"/><path d="M16 4a4 4 0 0 1 0 8"/><path d="M22 21v-1a6 6 0 0 0-4-5.6"/>',
  mic: '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/>',
  history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>',
  zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  sparkles: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M2 13h20"/>',
  code: '<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',
  trend: '<path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
  alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  play: '<path d="M7 4l13 8-13 8z"/>',
  monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  ticket: '<path d="M2 9a3 3 0 0 0 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 0 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><path d="M13 5v2M13 17v2M13 11v2"/>',
  db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
  listcheck: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m8 12 3 3 5-6"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  home: '<path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
  plug: '<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/>',
  coffee: '<path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/>',
  wave: '<path d="M2 12h2M6 8v8M10 4v16M14 7v10M18 10v4M22 12h0"/>',
  calcheck: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>',
};
function ic(name, size = 24, color = 'currentColor', sw = 2) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
}
function logoHTML(mark = 44, word = 34) {
  const r = mark * .5;
  return `<div class="logo"><div class="mark" style="width:${mark}px;height:${mark}px">${ic('link', r, '#fff', 2.6)}</div><div class="word" style="font-size:${word}px">Lynkk</div></div>`;
}
function iconCircle(name, size, bg, color, isz) {
  return `<div class="icon-circle" style="width:${size}px;height:${size}px;background:${bg};">${ic(name, isz || size * .48, color)}</div>`;
}

/* ---------- scene timing ---------- */
const SC = {};
TL.scenes.forEach((s, i) => {
  s.idx = i; s.dur = s.end - s.start; s.c = {}; s.ce = {};
  s.lines.forEach(l => { s.c[l.id] = l.start - s.start; s.ce[l.id] = l.end - s.start; });
  SC[s.id] = s;
});
const C = (sid, lid) => SC[sid].c[lid];
const CE = (sid, lid) => SC[sid].ce[lid];
const STEP_IDS = ['step1', 'step2', 'step3', 'step4', 'step5', 'step6'];
const STEP_NAMES = ['Start free', 'Calendar', 'Join & record', 'Ask live', 'Notes', 'Search'];

/* ---------- scene definitions ---------- */
const SCENES = {};
const scenesEl = $('#scenes');
function defScene(id, html, update, extra = {}) {
  const el = document.createElement('div');
  el.className = 'scene'; el.id = 'sc-' + id; el.innerHTML = html;
  scenesEl.appendChild(el);
  SCENES[id] = Object.assign({ id, el, update, q: s => $(s, el), qa: s => $$(s, el) }, extra);
}
function stepCol(n, title, desc, bullets) {
  return `<div class="stepcol">
    <div class="steppill sp">STEP ${n} OF 6</div>
    <div class="steptitle st">${title}</div>
    <div class="stepdesc sd">${desc}</div>
    <div class="bullets">${bullets.map(b => `<div class="bullet"><div class="ck">${ic('check', 22, '#34D399', 2.6)}</div><span>${b}</span></div>`).join('')}</div>
  </div>`;
}
function updateStepCol(sc, lt, bulletTimes) {
  show(sc.q('.sp'), P(lt, .1, .5), { y: 16 });
  show(sc.q('.st'), P(lt, .2, .6), { y: 24 });
  show(sc.q('.sd'), P(lt, .45, .6), { y: 20 });
  sc.qa('.bullet').forEach((b, i) => show(b, P(lt, bulletTimes[i], .45, backOut), { x: -26, y: 0 }));
}
function winOpen(el, lt, t0 = .25) { show(el, P(lt, t0, .7), { y: 40, s: .96 }); }
function winBar(title, extra = '') {
  return `<div class="bar"><div class="dots"><b style="background:#FF5F57"></b><b style="background:#FEBC2E"></b><b style="background:#28C840"></b></div>${title}${extra}</div>`;
}

/* INTRO */
defScene('intro', `
  <div class="abs" style="left:960px; top:250px; width:880px;">
    <div class="kicker k1"><i></i>Lynkk tutorial</div>
    <div class="h1 t1" style="margin-top:30px">How to record a</div>
    <div class="h1 t2 grad-text" style="padding-bottom:6px">Microsoft Teams</div>

/* cursor */
function cursorState(lt, keys) {
  if (!keys) return null;
  const first = keys[0], last = keys[keys.length - 1];
  if (lt < first.t - .35 || lt > last.t + .7) return null;
  let x = first.x, y = first.y;
  if (lt >= last.t) { x = last.x; y = last.y; }
  else for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (lt >= a.t && lt < b.t) { const k = easeInOut((lt - a.t) / (b.t - a.t)); x = lerp(a.x, b.x, k); y = lerp(a.y, b.y, k); break; }
  }
  const op = Math.min(clamp((lt - (first.t - .35)) / .35), 1 - clamp((lt - (last.t + .3)) / .4));
  let press = 0, ripple = null;
  keys.forEach(k => { if (k.click) { const d = lt - k.t; if (d > -.1 && d < .15) press = 1 - Math.abs(d) / .15; if (d >= 0 && d < .55) ripple = { x: k.x, y: k.y, k: d / .55 }; } });
  return { x, y, op, press, ripple };
}

/* ---------- frame renderer ---------- */
const ORDER = TL.scenes.map(s => s.id);
function renderFrame(t) {
  // background drift
  $('#blob1').style.transform = `translate(${-200 + Math.sin(t * .13) * 160}px, ${-300 + Math.cos(t * .11) * 120}px)`;
  $('#blob2').style.transform = `translate(${1100 + Math.cos(t * .09) * 180}px, ${-100 + Math.sin(t * .12) * 140}px)`;
  $('#blob3').style.transform = `translate(${600 + Math.sin(t * .1 + 2) * 220}px, ${500 + Math.cos(t * .08) * 120}px)`;
  $('#grid').style.backgroundPosition = `${t * 6}px ${t * 3}px`;

  let cur = 0;
  TL.scenes.forEach((s, i) => { if (t >= s.start) cur = i; });
  let cursor = null;
  TL.scenes.forEach((s, i) => {
    const sc = SCENES[s.id];
    const fin = i === 0 ? 1 : P(t, s.start - .25, .55, easeInOut);
    const fout = i === TL.scenes.length - 1 ? 1 : 1 - P(t, s.end - .3, .45, easeInOut);
    const k = Math.min(fin, fout);
    if (k <= 0.001) { sc.el.style.display = 'none'; return; }
    sc.el.style.display = 'block';
    sc.el.style.opacity = k;
    sc.el.style.transform = fout < 1 ? `scale(${1 + (1 - fout) * .03})` : `scale(${1 - (1 - fin) * .03})`;
    const lt = t - s.start;
    sc.update(lt);
    if (i === cur && sc.cursor) cursor = cursorState(lt, sc.cursor);
  });

  // tracker
  const sid = ORDER[cur];
  const stepIdx = STEP_IDS.indexOf(sid);
  const inSteps = t >= SC.step1.start - .3 && t < SC.step6.end - .2;
  show($('#tracker'), inSteps ? Math.min(P(t, SC.step1.start - .3, .5), 1 - P(t, SC.step6.end - .5, .4)) : 0, { y: -16 });
  $$('.tstep').forEach((el, i) => { el.classList.toggle('on', i === stepIdx); el.classList.toggle('done', stepIdx > i); });

  // avatar placement
  const curL = LAYOUT[SCENE_LAYOUT(sid)];
  let L = curL;
  if (cur > 0) {
    const prevL = LAYOUT[SCENE_LAYOUT(ORDER[cur - 1])];
    const k = P(t, SC[sid].start - .35, 1.0, easeInOut);
    L = { x: lerp(prevL.x, curL.x, k), y: lerp(prevL.y, curL.y, k), size: lerp(prevL.size, curL.size, k) };
  }
  if (cur < ORDER.length - 1) {
    const nextL = LAYOUT[SCENE_LAYOUT(ORDER[cur + 1])];
    const k = P(t, SC[sid].end - .35, 1.0, easeInOut);
    if (k > 0) L = { x: lerp(L.x, nextL.x, k), y: lerp(L.y, nextL.y, k), size: lerp(L.size, nextL.size, k) };
  }
  const s = L.size / 190;
  const fi = Math.min(TL.mouth.length - 1, Math.round(t * TL.fps));
  const amp = TL.mouth[fi] || 0;
  const introIn = P(t, .1, .8, backOut);
  const av = $('#avatar');
  av.style.transform = `translate(${L.x - 95}px, ${L.y - 95}px) scale(${s * (.6 + .4 * introIn)})`;
  av.style.opacity = clamp(introIn * 1.5);
  $('#avatar .glow').style.opacity = .5 + amp * .5;
  avatarFrame(t, amp);
  const tag = $('#nametag');
  const ts = clamp(lerp(1, 1.35, (L.size - 190) / 350), 1, 1.35);
  tag.style.transform = `translate(${L.x - tag.offsetWidth / 2}px, ${L.y + L.size / 2 + 14}px) scale(${ts})`;
  tag.style.transformOrigin = '50% 0';
  tag.style.opacity = P(t, .6, .6);
  $$('#nametag .bars i').forEach((b, i) => b.style.height = (5 + 17 * amp * (.55 + .45 * Math.abs(Math.sin(t * 13 + i * 1.7)))) + 'px');

  // top logo hidden on the big-logo moments
  const big = (t > SC.solution.start - .2 && t < SC.solution.end) || t > SC.outro.start - .2;
  $('#toplogo').style.opacity = big ? 1 - Math.min(P(t, SC.solution.start - .3, .4), 1) * (t < SC.outro.start - .2 ? 1 - P(t, SC.solution.end - .4, .4) : 1) : 1;

  // cursor
  const cEl = $('#cursor'), rEl = $('#ripple');
  if (cursor) {
    cEl.style.visibility = 'visible';
    cEl.style.opacity = cursor.op;
    cEl.style.transform = `translate(${cursor.x - 6}px, ${cursor.y - 3}px) scale(${1 - cursor.press * .15})`;
    if (cursor.ripple) {
      rEl.style.visibility = 'visible';
      rEl.style.transform = `translate(${cursor.ripple.x}px, ${cursor.ripple.y}px) scale(${.3 + cursor.ripple.k * 1.1})`;
      rEl.style.opacity = 1 - cursor.ripple.k;
    } else rEl.style.visibility = 'hidden';
  } else { cEl.style.visibility = 'hidden'; rEl.style.visibility = 'hidden'; }

  // final fade
  $('#fade').style.opacity = P(t, TL.duration - 1.0, 1.0, easeInOut);
}

function getSfx() {
  const out = [];
  TL.scenes.forEach((s, i) => {
    if (i > 0) out.push({ t: s.start - .15, type: 'whoosh' });
    const sc = SCENES[s.id];
    if (sc.sfx) sc.sfx().forEach(e => out.push({ t: s.start + e.t, type: e.type }));
    if (sc.cursor) sc.cursor.forEach(k => { if (k.click) out.push({ t: s.start + k.t, type: 'click' }); });
  });
  return out.sort((a, b) => a.t - b.t);
}
window.renderFrame = renderFrame;
window.getSfx = getSfx;
const qs = new URLSearchParams(location.search);
if (qs.has('t')) renderFrame(parseFloat(qs.get('t')));
window.renderThumb = () => {
  renderFrame(3.4);
  $('#sc-intro').style.display = 'none';
  $('#thumb').style.display = 'block';
  $('#nametag').style.display = 'none';
  $('#toplogo').innerHTML = logoHTML(64, 50);
};
</script>
