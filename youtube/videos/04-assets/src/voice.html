<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css">
<style>
  .box { position: absolute; left: 50%; bottom: 96px; width: 1360px; margin-left: -680px; display: flex; gap: 30px; align-items: flex-start;
    padding: 30px 40px; border-radius: 28px; background: rgba(11,16,32,.92); border: 2px solid rgba(108,108,255,.55); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .av { flex: none; width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; gap: 6px; }
  .av i { display: block; width: 8px; border-radius: 4px; background: #fff; }
  .who { font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }
  .say { font-size: 40px; font-weight: 600; line-height: 1.3; margin-top: 6px; min-height: 104px; }
</style></head><body class="alpha">
<div class="box"><div class="av"><i></i><i></i><i></i><i></i><i></i></div>
  <div><div class="who">LYNKK</div><div class="say" id="say"></div></div></div>
<script src="lib.js"></script><script>
const lines = [
  "On the last call, you agreed on a thirty-day pilot, starting after Harborline's security review is complete.",
  "Sharing the security overview now.",
];
const text = lines[+new URLSearchParams(location.search).get('i') || 0];
const end = 0.6 + text.length * 0.04;  // speaking time, roughly matches a natural voice pace
window.render = (t) => {
  const k = inOut(t, 0, end + 1.4);
  $('.box').style.opacity = k; $('.box').style.transform = `translateY(${(1 - k) * 30}px)`;
  const n = Math.round(text.length * clamp((t - 0.6) / (end - 0.6)));
  $('#say').textContent = text.slice(0, n);
  const talking = t > 0.6 && t < end;
  $$('.av i').forEach((b, j) => { b.style.height = (talking ? 18 + 26 * Math.abs(Math.sin(t * 9 + j * 1.3)) : 12) + 'px'; });
};
</script></body></html>
