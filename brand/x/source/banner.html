<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0A0A0B}
  #b{position:relative;width:1500px;height:500px;overflow:hidden;background:#0A0A0B;font-family:"Inter Display","Inter",sans-serif;color:#fff}
  canvas{position:absolute;inset:0}
  .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.2px);background-size:24px 24px;
        -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.35) 45%,transparent 70%)}
  .copy{position:absolute;left:440px;top:96px;width:620px}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font:600 15px/1 "Inter";letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.62)}
  .dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.14)}
  h1{margin:22px 0 0;font:700 60px/1.04 "Inter Display";letter-spacing:-.025em}
  h1 span{color:rgba(255,255,255,.5)}
  .stages{display:flex;gap:10px;margin-top:30px}
  .stage{font:500 17px/1 "Inter";padding:11px 16px;border:1px solid rgba(255,255,255,.22);border-radius:999px;color:rgba(255,255,255,.88)}
  .stage b{font-weight:700;color:#fff;margin-right:6px}
  .cta{margin-top:26px;font:500 17px/1 "Inter";color:rgba(255,255,255,.6)}
  .cta b{color:#fff;font-weight:700}
  .url{position:absolute;right:44px;bottom:36px;font:600 18px/1 "Inter";letter-spacing:.02em;color:#0A0A0B;background:#fff;padding:10px 16px;border-radius:999px}
</style></head>
<body>
<div id="b">
  <div class="grid"></div>
  <canvas id="c" width="3000" height="1000" style="width:1500px;height:500px"></canvas>
  <div class="copy">
    <div class="eyebrow"><span class="dot"></span>AI meeting assistant</div>
    <h1>Your AI teammate<br>for every meeting<span>.</span></h1>
    <div class="stages">
      <div class="stage"><b>Before</b>context</div>
      <div class="stage"><b>During</b>live voice</div>
      <div class="stage"><b>After</b>notes + tasks</div>
    </div>
    <div class="cta">Start free at <b>lynkk.ai</b></div>
  </div>
  
</div>
<script>
// Striped sphere echoing the Lynkk logo: bands of constant (twisted) latitude on a tilted sphere.
const S=2, c=document.getElementById('c'), g=c.getContext('2d');
const W=c.width,H=c.height, img=g.createImageData(W,H), d=img.data;
const cx=1268*S, cy=250*S, R=212*S;
const tilt=0.42, rot=-0.62, bands=6, twist=0.28;
const ct=Math.cos(tilt), st=Math.sin(tilt), cr=Math.cos(rot), sr=Math.sin(rot);
function ss(e0,e1,x){const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t)}
for(let py=0;py<H;py++)for(let px=0;px<W;px++){
  let x=(px+.5-cx)/R, y=(py+.5-cy)/R, r2=x*x+y*y;
  if(r2>1.02) continue;
  // rotate in screen plane
  let xr=x*cr-y*sr, yr=x*sr+y*cr;
  let z=Math.sqrt(Math.max(0,1-xr*xr-yr*yr));
  // tilt sphere axis toward viewer
  let Y=yr*ct+z*st, Z=-yr*st+z*ct, X=xr;
  let lat=Math.asin(Math.max(-1,Math.min(1,Y))), lon=Math.atan2(X,Z);
  let u=(lat/Math.PI+0.5)*bands*2 + twist*lon*bands/Math.PI;
  let f=u-Math.floor(u); // 0..1 within a band pair
  let aa=0.06*bands/ (R/S/330) * (1/Math.max(0.25,z)); // widen AA near limb
  aa=Math.min(0.25,0.012*(1+3*(1-z)));
  let w = ss(0.5-aa,0.5+aa,f)*(1-ss(1-aa,1,f)) + (f<aa? (1-ss(0,aa,f)):0); // white band in [0.5,1)
  w = (f>=0.5? ss(0.5-aa,0.5+aa,f) : 1-ss(-aa,aa,f)) ;
  w = f<0.25 ? 1-ss(-aa,aa,f) : ss(0.5-aa,0.5+aa,f);
  // soft shading toward limb
  let shade=0.78+0.22*z;
  let v=255*w*shade;
  // disk edge AA
  let edge=1-ss(1-0.004*S,1+0.004*S,Math.sqrt(r2));
  let i=(py*W+px)*4;
  d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=255*edge;
}
g.putImageData(img,0,0);
// thin ring around the sphere
g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=1.5*S;
g.beginPath();g.arc(cx,cy,R+30*S,0,Math.PI*2);g.stroke();
g.strokeStyle='rgba(255,255,255,.07)';
g.beginPath();g.arc(cx,cy,R+72*S,0,Math.PI*2);g.stroke();
document.body.dataset.ready='1';
</script>
</body></html>
