<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:"Inter",ui-sans-serif,system-ui,sans-serif;
    background:#111111;
    background-image:radial-gradient(#ffffff0a 1px, transparent 1px);
    background-size:7.3px 7.3px;
    color:#ffffff; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:48px 60px 44px;
  }
  .eyebrow {
    font-size:12px; line-height:1.5; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:#beb4fb;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow .mark { width:7px; height:7px; border-radius:999px; background:#beb4fb; }
  h1 {
    font-family:"Schibsted Grotesk","Inter",sans-serif;
    font-weight:700; font-size:50px; line-height:1.2; letter-spacing:-.04em;
    max-width:15ch;
  }
  .sub { font-size:18px; line-height:1.5; color:#ffffff80; max-width:46ch; margin-top:14px; }
  .foot { display:flex; align-items:center; justify-content:space-between; }
  .brand {
    font-family:"Schibsted Grotesk","Inter",sans-serif;
    font-weight:700; font-size:20px; letter-spacing:-.02em;
  }
  .brand span { color:#beb4fb; }
  .top { display:flex; gap:52px; align-items:center; justify-content:space-between; flex:1 1 auto; }
  .copy { flex:1 1 0; min-width:0; }
  .art { flex:0 0 448px; }
  .panel {
    background:#171717; border:1px solid #292c31; border-radius:24px;
    box-shadow:0 18px 44px -14px #00000099, inset 0 1px 0 #ffffff1a; padding:20px;
  }
  .mono { font-family:"JetBrains Mono",ui-monospace,monospace; }
</style></head><body>
<div class="top">
  <div class="copy">
    <div class="eyebrow"><span class="mark"></span>CRM hygiene</div>
    <h1 style="margin-top:18px">Four words on a $50,000 deal</h1>
    <div class="sub">Your pipeline data is not a discipline problem. The incentive is upside down.</div>
  </div>
  <div class="art"><div class="panel" style="padding:22px 24px">
  <div style="padding:11px 0;border-bottom:1px solid #1f2125">
      <div style="font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#ffffff57">Account</div>
      <div style="font-size:14px;margin-top:5px;color:#ffffff">Corvane Logistics</div></div>
  <div style="padding:11px 0;border-bottom:1px solid #1f2125">
      <div style="font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#ffffff57">Stage</div>
      <div style="font-size:14px;margin-top:5px;color:#ffffff">Proposal</div></div>
  <div style="padding:11px 0;border-bottom:1px solid #1f2125">
      <div style="font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#ffffff57">Value</div>
      <div style="font-size:14px;margin-top:5px;color:#ffffff">$50,000</div></div>
  <div style="padding:11px 0 0">
    <div style="font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#ffffff57">Call notes</div>
    <div style="margin-top:7px;height:92px;border:1px solid #292c31;border-radius:10px;
        background:#111111;padding:11px 12px;position:relative">
      <div style="font-size:13.5px;color:#ffffff80">good call, sending proposal</div>
      <div style="position:absolute;left:12px;top:34px;width:1.5px;height:15px;background:#beb4fb"></div>
    </div>
  </div>
</div></div>
</div>
<div class="foot">
  <div class="brand">Lynkk<span>.</span></div>
  <div style="font-size:13px;color:#ffffff57">lynkk.ai</div>
</div>
</body></html>
