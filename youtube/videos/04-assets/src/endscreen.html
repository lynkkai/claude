<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css">
<style>
  .top { position: absolute; top: 110px; width: 100%; text-align: center; }
  .wm { font-size: 96px; }
  .cta { font-size: 60px; font-weight: 800; margin-top: 18px; letter-spacing: -0.015em; }
  .cta span { color: var(--accent); }
  /* Slots line up with YouTube end-screen elements added in Studio (video left, subscribe right). */
  .slot { position: absolute; border: 3px solid rgba(169,177,214,.22); }
  .vid { left: 180px; top: 470px; width: 860px; height: 484px; border-radius: 24px; }
  .sub { left: 1260px; top: 532px; width: 360px; height: 360px; border-radius: 50%; }
</style></head><body class="solid">
<div class="top"><div class="wm wordmark">Lynk<span class="k2">k</span></div><div class="cta">Start free at <span>lynkk.ai</span></div></div>
<div class="slot vid"></div><div class="slot sub"></div>
<script src="lib.js"></script><script>
window.render = (t) => {
  const a = p(t, 0, 0.8); $('.top').style.opacity = a; $('.top').style.transform = `translateY(${(1 - a) * 30}px)`;
  $$('.slot').forEach((s) => (s.style.opacity = p(t, 0.6, 0.8)));
};
</script></body></html>
