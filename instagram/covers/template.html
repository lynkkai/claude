<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #111111;
    --ink: #ffffff;
    --muted: #a1a1a6;
    --rule: #ffffff1a;
    --violet: #7063be;
    --violet-ink: #9d91f0; /* brighter violet for text on the dark background */
    --lavender: #beb4fb;
    --pink: #f7b7ef;
    --orange: #f57b3a;
    --leaf: #93b45c;
    --live: #ff3b30;
    --accent: var(--lavender);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; background: var(--bg); overflow: hidden; }
  body {
    position: relative;
    font-family: "Inter Display", "Inter", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* Background: dot grid like lynkk.ai, plus a soft accent glow */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(#ffffff14 2px, transparent 2px);
    background-size: 40px 40px;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 25%, #000 75%, transparent 100%);
  }
  .glow {
    position: absolute; width: 1400px; height: 1400px; right: -620px; top: 40px;
    background: radial-gradient(circle, color-mix(in oklab, var(--accent), transparent 72%) 0%, transparent 62%);
  }
  .glow.b {
    right: auto; left: -760px; top: 900px;
    background: radial-gradient(circle, color-mix(in oklab, var(--violet), transparent 78%) 0%, transparent 60%);
  }

  /* Everything that matters sits inside the 3:4 grid crop (y 240 to 1680), with margin */
  .safe {
    position: absolute; left: 96px; right: 96px; top: 330px; bottom: 330px;
    display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand .tile {
    width: 84px; height: 84px; border-radius: 20px; background: #1c1c1e;
    border: 2px solid var(--rule);
    display: grid; place-items: center; color: var(--ink);
  }
  .brand .tile svg { width: 56px; height: 56px; }
  .brand .word { font-size: 52px; font-weight: 700; letter-spacing: -1px; }

  .eyebrow {
    margin-top: 150px; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 18px;
    padding: 16px 30px; border-radius: 999px;
    border: 2px solid color-mix(in oklab, var(--accent), transparent 55%);
    background: color-mix(in oklab, var(--accent), transparent 88%);
    font-family: "JetBrains Mono", monospace; font-size: 30px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase; color: var(--accent);
  }
  .eyebrow .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
  .eyebrow .dot.live { background: var(--live); box-shadow: 0 0 0 8px #ff3b3033; }

  h1 {
    margin-top: 56px;
    font-size: 132px; line-height: 1.02; font-weight: 800; letter-spacing: -4.5px;
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--accent); }

  .sub {
    margin-top: 48px; max-width: 820px;
    font-family: "Inter", sans-serif; font-size: 46px; line-height: 1.3; font-weight: 500;
    color: var(--muted); letter-spacing: -0.5px;
    text-wrap: balance;
  }

  .foot {
    margin-top: auto; padding-top: 36px; border-top: 2px solid var(--rule);
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 32px; font-weight: 500; color: var(--muted);
  }
  .foot .cta { color: var(--ink); }
  .foot .cta b { color: var(--accent); font-weight: 600; }

  /* Optional overlay showing the crops Instagram uses (render with --guides) */
  .guides { display: none; position: absolute; inset: 0; pointer-events: none; }
  .guides.on { display: block; }
  .guides div { position: absolute; left: 0; right: 0; border: 4px dashed; }
  .guides .g34 { top: 240px; height: 1440px; border-color: #00e5ff; }
  .guides .g45 { top: 285px; height: 1350px; border-color: #ffd60a; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="glow"></div>
  <div class="glow b"></div>

  <div class="safe">
    <div class="brand">
      <div class="tile" id="logo"></div>
      <div class="word">Lynkk</div>
    </div>
    <div class="eyebrow"><span class="dot" id="dot"></span><span id="eyebrow"></span></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="foot">
      <span>lynkk.ai</span>
      <span class="cta">Start <b>free</b></span>
    </div>
  </div>

  <div class="guides" id="guides"><div class="g34"></div><div class="g45"></div></div>
</body>
</html>
