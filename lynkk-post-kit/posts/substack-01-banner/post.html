<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Substack post 1 banner · Lynkk post</title>
<link rel="stylesheet" href="../../kit/post.css" />
<!-- Slide-specific CSS goes here, only when no kit block fits. Tokens only (var(--gr-*)), no hex. -->
<style></style>
</head>
<body>

<!-- 01 · Substack header for "Your AI notetaker shows up too late". Same stages as the example cover. -->
<section class="post" id="s1" data-size="wide">
  <main class="post-body" data-dots>
    <span class="eyebrow" data-tone="quiet">On the Lynkk Substack</span>
    <h2 class="t-h3">Your AI notetaker shows up too late. <span class="ink-2">It only covers the last part.</span></h2>
    <div class="stages mt-m">
      <figure class="stage is-off">
        <div class="plate plate-sky" data-rings>
          <div class="glass">
            <div class="glass-title">Your day</div>
            <div class="glass-body">
              <div class="m-row"><span class="m-t">10:00</span>Acme renewal</div>
              <div class="m-row"><span class="m-t">13:30</span>Design review</div>
            </div>
          </div>
        </div>
        <figcaption><span>Before</span><span class="ink-2">Nothing</span></figcaption>
      </figure>
      <figure class="stage is-off">
        <div class="plate plate-dusk" data-rings>
          <div class="glass">
            <div class="glass-title">Recording</div>
            <div class="glass-body">
              <div class="m-live"><span class="gr-live-dot"></span><span class="m-t">12:04</span></div>
              <div class="m-quote">"Ship the beta on the 21st."</div>
            </div>
          </div>
        </div>
        <figcaption><span>During</span><span class="ink-2">Nothing</span></figcaption>
      </figure>
      <figure class="stage">
        <div class="plate plate-ember" data-rings>
          <div class="glass">
            <div class="glass-title">Summary</div>
            <div class="glass-body">
              <div class="m-row"><span class="m-k">Decided</span>Beta on the 21st</div>
              <div class="m-row"><span class="m-k">Task</span>Sam, release notes</div>
            </div>
          </div>
        </div>
        <figcaption><span>After</span><span class="ink-2">The summary</span></figcaption>
      </figure>
    </div>
  </main>
</section>

<script src="../../kit/post.js"></script>
</body>
</html>
