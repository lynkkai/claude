<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:"Inter",ui-sans-serif,system-ui,sans-serif;
    background:#f5f5f4;
    background-image:radial-gradient(#11111108 1px, transparent 1px);
    background-size:7.3px 7.3px;
    color:#151514; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:48px 60px 44px;
  }
  .eyebrow {
    font-size:12px; line-height:1.5; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:#7063be;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow .mark { width:7px; height:7px; border-radius:999px; background:#7063be; }
  h1 {
    font-family:"Schibsted Grotesk","Inter",sans-serif;
    font-weight:700; font-size:50px; line-height:1.2; letter-spacing:-.04em;
    max-width:15ch;
  }
  .sub { font-size:18px; line-height:1.5; color:#6c6c6a; max-width:46ch; margin-top:14px; }
  .foot { display:flex; align-items:center; justify-content:space-between; }
  .brand {
    font-family:"Schibsted Grotesk","Inter",sans-serif;
    font-weight:700; font-size:20px; letter-spacing:-.02em;
  }
  .brand span { color:#7063be; }
  .top { display:flex; gap:52px; align-items:center; justify-content:space-between; flex:1 1 auto; }
  .copy { flex:1 1 0; min-width:0; }
  .art { flex:0 0 448px; }
  .panel {
    background:#ffffff; border:1px solid #e6e6e4; border-radius:24px;
    box-shadow:0 14px 34px -12px #00000059, inset 0 1px 0 transparent; padding:20px;
  }
  .mono { font-family:"JetBrains Mono",ui-monospace,monospace; }
</style></head><body>
<div class="top">
  <div class="copy">
    <div class="eyebrow"><span class="mark"></span>Real-time</div>
    <h1 style="margin-top:18px">You have two seconds</h1>
    <div class="sub">Latency, turn-taking and interrupts in a live meeting assistant.</div>
  </div>
  <div class="art"><div class="panel" style="padding:24px">
<svg width="390" height="207" viewBox="0 0 360 206">
  <text x="0" y="24" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9.5px" fill="#6c6c6a">END-TO-END BUDGET &middot; ms</text>
  <rect x="0" y="52" width="352" height="30" rx="4" fill="#f0f0ef" stroke="#e6e6e4"/>
  <rect x="0.0" y="52" width="19.1" height="30" rx="3" fill="#e0692a" opacity=".9"/><rect x="21.1" y="52" width="71.9" height="30" rx="3" fill="#7063be" opacity=".9"/><rect x="95.0" y="52" width="13.8" height="30" rx="3" fill="#2f7a4a" opacity=".9"/><rect x="110.9" y="52" width="56.1" height="30" rx="3" fill="#c24fb0" opacity=".9"/><rect x="169.0" y="52" width="110.6" height="30" rx="3" fill="#7a9a3e" opacity=".9"/><rect x="281.6" y="52" width="6.8" height="30" rx="3" fill="#e0692a" opacity=".9"/><line x1="0.0" y1="86" x2="0.0" y2="92" stroke="#e6e6e4"/><text x="0.0" y="106" text-anchor="middle" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:8.5px" fill="#a3a3a1">0</text><line x1="88.0" y1="86" x2="88.0" y2="92" stroke="#e6e6e4"/><text x="88.0" y="106" text-anchor="middle" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:8.5px" fill="#a3a3a1">500</text><line x1="176.0" y1="86" x2="176.0" y2="92" stroke="#e6e6e4"/><text x="176.0" y="106" text-anchor="middle" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:8.5px" fill="#a3a3a1">1000</text><line x1="264.0" y1="86" x2="264.0" y2="92" stroke="#e6e6e4"/><text x="264.0" y="106" text-anchor="middle" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:8.5px" fill="#a3a3a1">1500</text><line x1="352.0" y1="86" x2="352.0" y2="92" stroke="#e6e6e4"/><text x="352.0" y="106" text-anchor="middle" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:8.5px" fill="#a3a3a1">2000</text>
  <line x1="352" y1="42" x2="352" y2="92" stroke="#e5484d" stroke-width="1.6"/>
  <text x="352" y="36" text-anchor="end" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9.5px" fill="#e5484d">2s: a visible pause</text>
  <text x="0" y="142" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px" fill="#151514">1650ms with nothing going wrong</text>
  <text x="0" y="164" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9.5px" fill="#6c6c6a">p99 is the number that matters</text>
  <text x="0" y="188" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9px" fill="#a3a3a1">illustrative, not measured</text>
</svg></div></div>
</div>
<div class="foot">
  <div class="brand">Lynkk<span>.</span></div>
  <div style="font-size:13px;color:#a3a3a1">lynkk.ai</div>
</div>
</body></html>
