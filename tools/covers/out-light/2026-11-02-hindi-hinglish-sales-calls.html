<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:"Inter",ui-sans-serif,system-ui,sans-serif;
    background:#f5f5f4;
    background-image:radial-gradient(#11111108 1px, transparent 1px);
    background-size:7.3px 7.3px;
    color:#151514; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:48px 60px 44px;
  }
  .eyebrow {
    font-size:12px; line-height:1.5; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:#7063be;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow .mark { width:7px; height:7px; border-radius:999px; background:#7063be; }
  h1 {
    font-family:"Schibsted Grotesk","Inter",sans-serif;
    font-weight:700; font-size:50px; line-height:1.2; letter-spacing:-.04em;
    max-width:15ch;
  }
  .sub { font-size:18px; line-height:1.5; color:#6c6c6a; max-width:46ch; margin-top:14px; }
  .foot { display:flex; align-items:center; justify-content:space-between; }
  .brand {
    font-family:"Schibsted Grotesk","Inter",sans-serif;
    font-weight:700; font-size:20px; letter-spacing:-.02em;
  }
  .brand span { color:#7063be; }
  .top { display:flex; gap:52px; align-items:center; justify-content:space-between; flex:1 1 auto; }
  .copy { flex:1 1 0; min-width:0; }
  .art { flex:0 0 448px; }
  .panel {
    background:#ffffff; border:1px solid #e6e6e4; border-radius:24px;
    box-shadow:0 14px 34px -12px #00000059, inset 0 1px 0 transparent; padding:20px;
  }
  .mono { font-family:"JetBrains Mono",ui-monospace,monospace; }
</style></head><body>
<div class="top">
  <div class="copy">
    <div class="eyebrow"><span class="mark"></span>Hinglish</div>
    <h1 style="margin-top:18px">One sentence, two languages</h1>
    <div class="sub">Most tools support Hindi. Few survive a sentence that switches mid-way.</div>
  </div>
  <div class="art"><div class="panel" style="padding:22px 24px">
  <div style="display:flex;align-items:center;gap:9px;font-size:11px;color:#a3a3a1">
    <span class="mono" style="color:#7063be">14:22</span>
    <span style="width:4px;height:4px;border-radius:999px;background:#a3a3a1"></span>
    <span>Priya Raman</span></div>
  <div style="font-size:19px;line-height:1.62;margin-top:12px;letter-spacing:-.02em">
    <span style="background:#e2e0f2;border-radius:4px;padding:1px 4px">Budget to approve ho gaya hai,</span>
    but procurement will take three weeks, so kickoff first week of December.</div>
  <div style="display:flex;gap:16px;margin-top:18px;padding-top:15px;border-top:1px solid #efefed;font-size:11.5px;color:#6c6c6a">
    <span style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;border-radius:3px;background:#e2e0f2;border:1px solid #b4abe0"></span>Hinglish</span>
    <span style="display:flex;align-items:center;gap:7px"><span style="width:10px;height:10px;border-radius:3px;background:#ffffff;border:1px solid #e6e6e4"></span>English</span>
    <span style="margin-left:auto;color:#7063be;font-weight:600">1 switch</span>
  </div></div></div>
</div>
<div class="foot">
  <div class="brand">Lynkk<span>.</span></div>
  <div style="font-size:13px;color:#a3a3a1">lynkk.ai</div>
</div>
</body></html>
