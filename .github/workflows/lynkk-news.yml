name: Lynkk trending AI news

on:
  schedule:
    - cron: "23 * * * *" # every hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write articles to the log only, publish nothing"
        type: boolean
        default: false

concurrency:
  group: lynkk-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: news-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news-bot/requirements.txt
      - run: pip install -r requirements.txt

      - name: Find trends, write and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PUBLISH_TARGET: ${{ vars.PUBLISH_TARGET || 'markdown' }}
          PUBLISH_STATUS: ${{ vars.PUBLISH_STATUS || 'draft' }}
          WP_URL: ${{ vars.WP_URL }}
          WP_USER: ${{ vars.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_CATEGORY_ID: ${{ vars.WP_CATEGORY_ID }}
          NEWS_WEBHOOK_URL: ${{ vars.NEWS_WEBHOOK_URL }}
          NEWS_WEBHOOK_TOKEN: ${{ secrets.NEWS_WEBHOOK_TOKEN }}
        run: python -m newsbot ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save dedupe state and markdown output
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "lynkk-news-bot"
          git config user.email "marketing@lynkk.ai"
          git add state.json output 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "news-bot: publish trending AI news" && git push)
