<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css">
<style>
  h1 { position: absolute; top: 120px; width: 100%; text-align: center; font-size: 68px; font-weight: 800; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .row { position: absolute; top: 280px; left: 150px; right: 150px; display: flex; gap: 60px; }
  .c { flex: 1; height: 560px; border-radius: 36px; background: var(--card); border: 3px solid #2a3366;
    padding: 56px 48px; display: flex; flex-direction: column; gap: 28px; }
  .ic { flex: none; width: 112px; height: 112px; border-radius: 28px; background: rgba(108,108,255,.16); display: grid; place-items: center; }
  .ic svg { width: 64px; height: 64px; stroke: var(--accent); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .st { font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
  .tt { font-size: 52px; font-weight: 800; line-height: 1.08; letter-spacing: -0.015em; }
  .ds { font-size: 30px; color: var(--muted); line-height: 1.35; }
  .foot { position: absolute; bottom: 70px; width: 100%; text-align: center; font-size: 34px; }
</style></head><body class="solid">
<h1 id="h">One AI across the <span>entire sales call</span></h1>
<div class="row">
  <div class="c"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></div>
    <div class="st">Before</div><div class="tt">Prep from past conversations</div><div class="ds">What was discussed, what's still open, who said what</div></div>
  <div class="c"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
    <div class="st">During</div><div class="tt">Live answers by voice</div><div class="ds">Ask out loud, pull up documents, mid-call</div></div>
  <div class="c"><div class="ic"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></div>
    <div class="st">After</div><div class="tt">Notes, tasks, CRM, follow-up</div><div class="ds">Done within about 30 seconds of the call ending</div></div>
</div>
<div class="foot wordmark">Lynk<span class="k2">k</span></div>
<script src="lib.js"></script><script>
const cards = $$('.c');
window.render = (t) => {
  const h = p(t, 0.2, 0.8); $('#h').style.opacity = h; $('#h').style.transform = `translateY(${(1 - h) * 30}px)`;
  $('.foot').style.opacity = p(t, 2.6, 0.8);
  cards.forEach((c, i) => {
    const a = p(t, 0.9 + i * 0.45, 0.7);
    // spotlight: card i is focused during [4+3i, 7+3i]; all cards full again after 13s
    const focus = t >= 4 && t < 13 ? (Math.floor((t - 4) / 3) === i ? 1 : 0) : -1;
    const f = focus === -1 ? 0 : focus;
    const dim = focus === 0 ? 0.42 : 1;
    c.style.opacity = a * dim;
    c.style.transform = `translateY(${(1 - a) * 60}px) scale(${1 + 0.04 * f})`;
    c.style.borderColor = f ? 'var(--accent)' : '#2a3366';
    c.style.boxShadow = f ? '0 0 80px rgba(108,108,255,.35)' : 'none';
    c.style.transition = 'none';
  });
};
</script></body></html>
