<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css">
<style>
  .list { position: absolute; top: 210px; left: 360px; display: flex; flex-direction: column; gap: 44px; }
  .it { display: flex; align-items: center; gap: 40px; font-size: 78px; font-weight: 800; letter-spacing: -0.02em; }
  .bx { width: 74px; height: 74px; border-radius: 18px; border: 6px solid #3a4380; flex: none; }
  .then { position: absolute; bottom: 120px; width: 100%; text-align: center; font-size: 52px; font-weight: 700; color: var(--warn); }
</style></head><body class="solid">
<div class="list">
  <div class="it"><div class="bx"></div>Write up the notes.</div>
  <div class="it"><div class="bx"></div>Update the CRM.</div>
  <div class="it"><div class="bx"></div>Send the follow-up.</div>
  <div class="it"><div class="bx"></div>Book the next meeting.</div>
</div>
<div class="then">...and the next call is already starting.</div>
<script src="lib.js"></script><script>
window.render = (t) => {
  $$('.it').forEach((el, i) => { const a = p(t, 0.3 + i * 0.9, 0.5); el.style.opacity = a; el.style.transform = `translateX(${(1 - a) * -60}px)`; });
  const th = p(t, 4.6, 0.6); $('.then').style.opacity = th; $('.then').style.transform = `translateY(${(1 - th) * 20}px)`;
  document.body.style.opacity = 1 - p(t, 7.4, 0.6, easeInOut);
};
</script></body></html>
