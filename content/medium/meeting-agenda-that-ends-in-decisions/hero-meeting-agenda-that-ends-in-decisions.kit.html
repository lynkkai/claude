<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Medium hero: meeting agenda article · Lynkk post</title>
<link rel="stylesheet" href="../../kit/post.css" />
<style></style>
</head>
<body>

<!-- Medium article header, wide 1600x900. Split: copy left, sky plate with an
     agenda written as questions right. No product claims on this image. -->
<section class="post" id="hero" data-size="wide">
  <main class="post-body">
    <div class="split">
      <div>
        <span class="eyebrow">Meeting agendas</span>
        <h2 class="t-h2">A topic never ends.<br><span class="ink-2">A question does.</span></h2>
        <p class="t-lead mt-m">Write each agenda item as a question. Start with what last week left open.</p>
      </div>
      <div class="plate plate-sky scene" data-rings>
        <div class="glass" data-size="l">
          <div class="glass-title">Thursday sync, 30 min</div>
          <div class="glass-body">
            <div class="m-option"><span class="m-check on"><i data-icon="check"></i></span><span>Open from last week</span><span class="m-chip">2 items</span></div>
            <div class="m-option"><span class="m-check"></span><span>Which two Q4 projects?</span><span class="m-chip">Decide</span></div>
            <div class="m-option"><span class="m-check"></span><span>What does the new hire own?</span><span class="m-chip">Input</span></div>
            <div class="m-option"><span class="m-check"></span><span>Billing timeline</span><span class="m-chip">Inform</span></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</section>

<script src="../../kit/post.js"></script>
</body>
</html>
