<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;font-weight:500;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-weight:600;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Plex;font-weight:400;src:url(node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Plex;font-weight:500;src:url(node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Plex;font-weight:600;src:url(node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2) format('woff2')}
:root{--bg:#f7f6f2;--ink:#16181d;--body:#3d414b;--muted:#5b5f6a;--line:#e4e2da;--line2:#d6d3c8;--accent:#3346d3;--accent2:#2b3bb8;--soft:#e8eafb;--teal:#0f766e;--clay:#b4541f;--rec:#c2412d}
html,body{margin:0;background:#000}
#stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--bg);font-family:Plex,system-ui,sans-serif;color:var(--ink)}
.abs{position:absolute}
.h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:80px;line-height:1.04;letter-spacing:-0.02em;margin:0}
.h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:56px;line-height:1.08;letter-spacing:-0.015em;margin:0}
.lead{font-size:32px;line-height:1.45;color:var(--body);margin:0}
.eyebrow{font-size:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px rgba(22,24,29,.04),0 18px 40px rgba(22,24,29,.07)}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 20px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-size:20px;font-weight:600}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.caret{display:inline-block;width:3px;height:1em;background:var(--accent);vertical-align:-0.12em;margin-left:2px}
</style></head>
<body><div id="stage"></div>
<script>
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);              // ease out cubic
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const ap=(t,s,d=.5)=>eo((t-s)/d);                   // appear progress 0..1
const A=(p,dy=28,dx=0,sc=0)=>`opacity:${p.toFixed(3)};transform:translate(${((1-p)*dx).toFixed(1)}px,${((1-p)*dy).toFixed(1)}px) scale(${(1-(1-p)*sc).toFixed(3)})`;
const typed=(s,t,start,cps=26,caret=true)=>{const n=Math.floor(clamp((t-start)*cps,0,s.length));const on=caret&&n<s.length&&t>=start;return esc(s.slice(0,n))+(on?'<span class="caret"></span>':'')};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
const I={ // stroke icons
 mic:(c='currentColor',s=28)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`,
 check:(c='currentColor',s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
 x:(c='currentColor',s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
 wifioff:(c='currentColor',s=40)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 12.6a10 10 0 0 1 5-2.5M14 10.1a10 10 0 0 1 5 2.5M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5.1A15 15 0 0 1 22 8.8"/><circle cx="12" cy="20" r=".6" fill="${c}"/></svg>`,
 globe:(c='currentColor',s=40)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg>`,
 laptop:(c='currentColor',s=40)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>`,
 gear:(c='currentColor',s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
 cursor:(c='currentColor',s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="#fff" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>`,
 browser:(c='currentColor',s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>`,
 sound:(c='currentColor',s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>`,
 click:(c='currentColor',s=30)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"><path d="M9 9l11 4-5 1.5L13.5 20z"/><path d="M5 5l1.5 1.5M9 3v2M3 9h2"/></svg>`,
};
// waveform bars
const wave=(t,n=24,h=48,c='var(--accent)',on=1)=>{let s='';for(let i=0;i<n;i++){const v=on?(.25+.75*Math.abs(Math.sin(t*6.3+i*.9)*Math.sin(t*2.1+i*.37))):.12;s+=`<div style="width:5px;height:${(v*h).toFixed(1)}px;border-radius:3px;background:${c}"></div>`}return `<div class="row" style="gap:4px;height:${h}px">${s}</div>`};
const brandMark=(o=1)=>`<div class="abs row" style="left:72px;top:52px;gap:12px;opacity:${o}"><div style="font-family:Fraunces;font-weight:600;font-size:32px;letter-spacing:-.01em">Lynkk</div></div>`;
const stepPill=(txt,o=1)=>txt?`<div class="abs" style="right:72px;top:50px;opacity:${o}"><span class="pill" style="background:#fff;border:1px solid var(--line);font-size:20px;color:var(--muted)">${txt}</span></div>`:'';
const cta=(label)=>`<span class="pill" style="background:var(--accent);color:#fff;font-size:34px;padding:22px 44px;border-radius:16px">${label}</span>`;

// ---------- timeline ----------
let SC=[],TOTAL=0;
function setScenes(s){SC=s;TOTAL=s.reduce((a,b)=>a+b.d,0);window.TOTAL=TOTAL}
function renderFrame(t){
 let acc=0,cur=SC[SC.length-1],lt=0,i=SC.length-1;
 for(let k=0;k<SC.length;k++){if(t<acc+SC[k].d){cur=SC[k];lt=t-acc;i=k;break}acc+=SC[k].d}
 if(t>=TOTAL){lt=cur.d}
 const fin=ap(lt,0,.45),fout=1-eo((lt-(cur.d-.4))/.4);
 const o=Math.min(fin,i===SC.length-1?1:fout);
 const bg=cur.bg||'var(--bg)';
 const prog=clamp(t/TOTAL);
 document.getElementById('stage').innerHTML=
  `<div class="abs" style="inset:0;background:${bg}"></div>`+
  `<div class="abs" style="inset:0;opacity:${o.toFixed(3)}">${cur.r(lt,cur.d)}</div>`+
  (cur.noMark?'':brandMark())+stepPill(cur.step,o)+
  `<div class="abs" style="left:0;bottom:0;height:6px;width:${(prog*1920).toFixed(1)}px;background:var(--accent)"></div>`;
}
window.renderFrame=renderFrame;window.setScenes=setScenes;
</script>
<script>document.write('<script src="'+(new URLSearchParams(location.search).get('v')||'v1')+'.js"><\/script>')</script>
</body></html>
