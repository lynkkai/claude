<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css">
<style>
  .card { position: absolute; top: 64px; right: 72px; display: flex; align-items: center; gap: 28px;
    padding: 26px 40px 26px 28px; border-radius: 28px; background: rgba(11,16,32,.88);
    border: 2px solid rgba(108,108,255,.55); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  svg { width: 128px; height: 128px; transform: rotate(-90deg); }
  .num { font-size: 76px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .lbl { font-size: 26px; color: var(--muted); margin-top: 8px; font-weight: 500; }
</style></head><body class="alpha">
<div class="card">
  <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" stroke="#2a3366" stroke-width="12" fill="none"/>
  <circle id="ring" cx="60" cy="60" r="50" stroke="url(#g)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
  <defs><linearGradient id="g"><stop offset="0" stop-color="#6c6cff"/><stop offset="1" stop-color="#2fd27a"/></linearGradient></defs></svg>
  <div><div class="num" id="num">0:00</div><div class="lbl">after the call ends</div></div>
</div>
<script src="lib.js"></script><script>
window.render = (t) => {
  const card = $('.card'), k = inOut(t, 0, 4.0);
  card.style.opacity = k; card.style.transform = `translateY(${(1 - k) * -24}px)`;
  const s = Math.round(30 * p(t, 0.5, 3.0, easeInOut));
  $('#num').textContent = `0:${String(s).padStart(2, '0')}`;
  $('#ring').style.strokeDashoffset = 314.16 * (1 - s / 30);
};
</script></body></html>
