<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Medium hero: meeting notes article · Lynkk post</title>
<link rel="stylesheet" href="../../kit/post.css" />
<style>
  /* Medium header: no Lynkk branding. Hide the top bar (mark + name) and the
     foot (lynkk.ai). Hidden, not removed, so the column keeps the kit's spacing. */
  #hero .post-top, #hero .post-foot { visibility: hidden; }
</style>
</head>
<body>

<!-- Medium article header, wide 1600x900. Split: copy left, ember plate with the
     notes from the article's example meeting right. No product claims and no
     Lynkk branding on this image. -->
<section class="post" id="hero" data-size="wide">
  <main class="post-body">
    <div class="split">
      <div>
        <span class="eyebrow">Meeting notes</span>
        <h2 class="t-h2">Write down what happens next.<br><span class="ink-2">Let the rest go.</span></h2>
        <p class="t-lead mt-m">Notes that someone who missed the meeting can act on in two minutes.</p>
      </div>
      <div class="plate plate-ember scene" data-rings>
        <div class="glass" data-size="l">
          <div class="glass-title">Q4 pricing review</div>
          <div class="glass-body">
            <div class="m-option"><span class="m-check on"><i data-icon="check"></i></span><span>Keep the free tier</span><span class="m-chip">Decision</span></div>
            <div class="m-option"><span class="m-check"></span><span>Send pricing page copy</span><span class="m-chip">Priya · Thu</span></div>
            <div class="m-option"><span class="m-check"></span><span>Draft customer email</span><span class="m-chip">Sam · Fri</span></div>
            <div class="m-option"><span class="m-check"></span><span>Confirm with finance</span><span class="m-chip">Ana · Wed</span></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</section>

<script src="../../kit/post.js"></script>
</body>
</html>
