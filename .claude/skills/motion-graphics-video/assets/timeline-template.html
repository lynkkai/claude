<!doctype html>
<!--
  Starter timeline that satisfies the render contract. Copy it into the project as
  index.html and replace the shots. Keep the helpers: seeded random, pure time, shot
  scheduling and easing are the parts every piece needs and the parts easiest to get
  subtly wrong.

  Render with:
    node .claude/skills/motion-graphics-video/scripts/render.mjs --html out/index.html \
      --out out/film.mp4
-->
<meta charset="utf-8" />
<title>timeline</title>
<style>
  /* No CSS transitions or animations anywhere: time comes only from renderFrame(t). */
  :root {
    --bg: #0d0b0a;
    --ink: #f6f1ea;
    --accent: #ff7a3d;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .layer { position: absolute; inset: 0; }
  #grain { pointer-events: none; opacity: .05; mix-blend-mode: overlay; }
  #vignette {
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%);
  }
</style>

<div id="stage">
  <div class="layer" id="scene"></div>
  <canvas class="layer" id="grain"></canvas>
  <div class="layer" id="vignette"></div>
</div>

<script>
  window.FPS = 30;
  window.DURATION = 15;
  window.WIDTH = 1920;
  window.HEIGHT = 1080;

  // Seeded randomness, so grain and jitter are identical on every render.
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Easing: entrances decelerate, exits accelerate, moves do both.
  const ease = {
    out: (p) => 1 - Math.pow(1 - p, 3),
    in: (p) => p * p * p,
    inOut: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
    outBack: (p) => 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2),
  };

  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  // Local progress through a window, eased. The workhorse of every animation here.
  const at = (t, start, dur, fn = ease.out) => fn(clamp01((t - start) / dur));

  // Shots: edit this table, then the beat grid in shots.md stays the source of truth.
  const SHOTS = [
    { in: 0.0, out: 3.0, name: 'open' },
    { in: 3.0, out: 6.0, name: 'feature-1' },
    { in: 6.0, out: 9.0, name: 'feature-2' },
    { in: 9.0, out: 12.0, name: 'proof' },
    { in: 12.0, out: 15.0, name: 'lockup' },
  ];
  const shotAt = (t) => SHOTS.find((s) => t >= s.in && t < s.out) || SHOTS[SHOTS.length - 1];

  const scene = document.getElementById('scene');
  const grain = document.getElementById('grain');
  let grainReady = false;

  function drawGrain() {
    // One static grain plate, scaled up: cheap, and it does not flicker between frames.
    const rand = mulberry32(1337);
    const n = 256;
    grain.width = n; grain.height = n;
    const ctx = grain.getContext('2d');
    const img = ctx.createImageData(n, n);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 120 + rand() * 135;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    grain.style.width = '100%'; grain.style.height = '100%';
    grainReady = true;
  }

  function renderOpen(t, s) {
    const local = t - s.in;
    const rise = at(local, 0.1, 0.9, ease.outBack);
    const fade = 1 - at(local, 2.4, 0.5, ease.in);
    scene.innerHTML = `
      <div style="
        position:absolute; left:8%; top:50%;
        transform: translateY(${-50 + (1 - rise) * 6}%);
        opacity:${fade};
        color:var(--ink);
        font: 700 ${0.085 * window.innerHeight}px/1.05 system-ui, sans-serif;
        letter-spacing:-.02em; max-width:60%;
      ">Replace this with the real line</div>`;
  }

  function renderShot(t, s) {
    // One shot per function, driven only by local time. Add the rest the same way.
    if (s.name === 'open') return renderOpen(t, s);
    const local = t - s.in;
    const p = at(local, 0.05, 0.8);
    scene.innerHTML = `
      <div style="
        position:absolute; left:50%; top:50%;
        width:${260 + 420 * p}px; height:${160 + 180 * p}px;
        margin:${-(80 + 90 * p)}px 0 0 ${-(130 + 210 * p)}px;
        background:var(--accent); border-radius:${28 - 16 * p}px;
        opacity:${0.15 + 0.85 * p};
      "></div>`;
  }

  window.renderFrame = async function renderFrame(t) {
    // Fonts must be ready before the first draw, or the opening second renders in a
    // fallback face and the type jumps once it loads.
    await document.fonts.ready;
    if (!grainReady) drawGrain();
    renderShot(t, shotAt(t));
  };

  // Called by the renderer when the output size differs from the declared one, so
  // layout can branch for 9:16 and 1:1 cuts instead of being cropped.
  window.onResize = function (w, h) {
    document.documentElement.dataset.aspect = (w / h).toFixed(3);
  };
</script>
