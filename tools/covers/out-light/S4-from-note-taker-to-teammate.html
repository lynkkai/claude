<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:"Inter",ui-sans-serif,system-ui,sans-serif;
    background:#f5f5f4;
    background-image:radial-gradient(#11111108 1px, transparent 1px);
    background-size:7.3px 7.3px;
    color:#151514; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:48px 60px 44px;
  }
  .eyebrow {
    font-size:12px; line-height:1.5; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:#7063be;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow .mark { width:7px; height:7px; border-radius:999px; background:#7063be; }
  h1 {
    font-family:"Schibsted Grotesk","Inter",sans-serif;
    font-weight:700; font-size:46px; line-height:1.2; letter-spacing:-.04em;
    max-width:13ch;
  }
  .sub { font-size:18px; line-height:1.5; color:#6c6c6a; max-width:46ch; margin-top:14px; }
  .foot { display:flex; align-items:center; justify-content:space-between; }
  .brand {
    font-family:"Schibsted Grotesk","Inter",sans-serif;
    font-weight:700; font-size:20px; letter-spacing:-.02em;
  }
  .brand span { color:#7063be; }
  .top { display:flex; gap:52px; align-items:center; justify-content:space-between; flex:1 1 auto; }
  .copy { flex:1 1 0; min-width:0; }
  .art { flex:0 0 448px; }
  .panel {
    background:#ffffff; border:1px solid #e6e6e4; border-radius:24px;
    box-shadow:0 14px 34px -12px #00000059, inset 0 1px 0 transparent; padding:20px;
  }
  .mono { font-family:"JetBrains Mono",ui-monospace,monospace; }
</style></head><body>
<div class="top">
  <div class="copy">
    <div class="eyebrow"><span class="mark"></span>Essay</div>
    <h1 style="margin-top:18px">From note taker to teammate</h1>
    <div class="sub">What changes when the assistant speaks while you are still talking.</div>
  </div>
  <div class="art"><div class="panel" style="padding:26px">
<svg width="372" height="214" viewBox="0 0 330 200">
  <line x1="0" y1="96" x2="330" y2="96" stroke="#e6e6e4" stroke-width="1.4"/>
  <circle cx="44" cy="96" r="6" fill="#a3a3a1"/>
  <text x="44" y="78" text-anchor="middle" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9px" fill="#a3a3a1">before</text>
  <circle cx="165" cy="96" r="9" fill="#7063be"/>
  <text x="165" y="74" text-anchor="middle" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9.5px" fill="#7063be">during</text>
  <circle cx="286" cy="96" r="6" fill="#a3a3a1"/>
  <text x="286" y="78" text-anchor="middle" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9px" fill="#a3a3a1">after</text>
  <rect x="86" y="124" width="158" height="34" rx="17" fill="#e2e0f2" stroke="#b4abe0"/>
  <text x="165" y="146" text-anchor="middle" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9.5px" fill="#151514">it speaks here</text>
  <text x="165" y="186" text-anchor="middle" style="font-family:"JetBrains Mono",ui-monospace,monospace;font-size:9px" fill="#a3a3a1">in development</text>
</svg></div></div>
</div>
<div class="foot">
  <div class="brand">Lynkk<span>.</span></div>
  <div style="font-size:13px;color:#a3a3a1">lynkk.ai</div>
</div>
</body></html>
